<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清风随笔</title>
<style>
/* ==========================================
   RESET & VARIABLES
   ========================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#FDF8F0;
  --bg-soft:#F7F1E9;
  --card-bg:#FFFFFF;
  --nav-bg:rgba(253,248,240,0.94);
  --accent:#6B9080;
  --accent-hover:#5A7D6E;
  --accent-soft:#E6F0E8;
  --tag-bg:#E6F0E8;
  --tag-text:#6B9080;
  --title:#2D3A3A;
  --text:#4A5555;
  --text-muted:#8A9595;
  --border:#E8DDD0;
  --border-light:#F0E8DA;
  --shadow:0 2px 16px rgba(0,0,0,0.05);
  --shadow-hover:0 4px 24px rgba(0,0,0,0.1);
  --input-bg:#FFFFFF;
  --input-border:#D0C8B8;
  --font-serif:"Noto Serif SC","STSong","SimSun","KaiTi",serif;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --nav-height:64px;
  --max-width:800px;
  --radius:12px;
  --radius-sm:8px;
}

[data-theme="dark"]{
  --bg:#1A1D23;
  --bg-soft:#1F2229;
  --card-bg:#242830;
  --nav-bg:rgba(26,29,35,0.94);
  --accent:#E8A87C;
  --accent-hover:#D4956B;
  --accent-soft:#3A2A28;
  --tag-bg:#3A2A28;
  --tag-text:#E8A87C;
  --title:#E8D5C4;
  --text:#B0AFA8;
  --text-muted:#6A6C70;
  --border:#353840;
  --border-light:#2D3038;
  --shadow:0 2px 16px rgba(0,0,0,0.25);
  --shadow-hover:0 4px 24px rgba(0,0,0,0.4);
  --input-bg:#2D303A;
  --input-border:#454850;
}

html{scroll-behavior:smooth}

body{
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--text);
  line-height:1.7;
  min-height:100vh;
  transition:background 0.35s,color 0.35s;
}

a{color:var(--accent);text-decoration:none;transition:color 0.2s}
a:hover{color:var(--accent-hover)}

/* ==========================================
   NAVIGATION
   ========================================== */
nav{
  position:sticky;top:0;z-index:100;
  height:var(--nav-height);
  background:var(--nav-bg);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-light);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;
  transition:background 0.35s,border-color 0.35s;
}

.nav-brand{
  font-family:var(--font-serif);
  font-size:1.35rem;
  font-weight:700;
  color:var(--title);
  letter-spacing:0.05em;
  display:flex;align-items:center;gap:8px;
}

.nav-brand::before{content:"✍";font-size:1rem}

.nav-links{display:flex;align-items:center;gap:8px;list-style:none}

.nav-links a{
  padding:8px 16px;
  border-radius:var(--radius-sm);
  color:var(--text);
  font-size:0.95rem;
  transition:all 0.2s;
}

.nav-links a:hover,
.nav-links a.active{
  background:var(--accent-soft);
  color:var(--accent);
}

#theme-toggle{
  background:none;border:1px solid var(--border);
  cursor:pointer;font-size:1.15rem;
  padding:6px 10px;border-radius:var(--radius-sm);
  transition:all 0.2s;
  line-height:1;
}

#theme-toggle:hover{background:var(--accent-soft);border-color:var(--accent)}

.menu-btn{
  display:none;background:none;border:none;
  color:var(--text);font-size:1.5rem;cursor:pointer;
  padding:4px 8px;
}

/* ==========================================
   MAIN CONTENT
   ========================================== */
main{
  max-width:var(--max-width);
  margin:0 auto;
  padding:32px 24px 80px;
  min-height:calc(100vh - var(--nav-height));
}

/* ==========================================
   HOME — Search & Filter
   ========================================== */
.home-header{
  text-align:center;
  padding:32px 0 20px;
}

.home-header h1{
  font-family:var(--font-serif);
  font-size:2rem;
  color:var(--title);
  margin-bottom:8px;
}

.home-header p{color:var(--text-muted);font-size:0.95rem}

.search-wrap{
  position:relative;
  max-width:480px;
  margin:0 auto 28px;
}

.search-wrap input{
  width:100%;
  padding:12px 16px 12px 42px;
  border:1.5px solid var(--input-border);
  border-radius:var(--radius);
  background:var(--input-bg);
  color:var(--text);
  font-size:0.95rem;
  font-family:var(--font-sans);
  transition:all 0.25s;
  outline:none;
}

.search-wrap input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);
}

.search-wrap input::placeholder{color:var(--text-muted)}

.search-wrap .search-icon{
  position:absolute;left:14px;top:50%;
  transform:translateY(-50%);
  color:var(--text-muted);
  font-size:1.05rem;
  pointer-events:none;
}

/* Tags */
.tags-bar{
  display:flex;flex-wrap:wrap;gap:8px;
  justify-content:center;
  margin-bottom:28px;
}

.tags-bar .tag{
  padding:6px 14px;
  border-radius:20px;
  font-size:0.85rem;
  background:var(--tag-bg);
  color:var(--tag-text);
  cursor:pointer;
  transition:all 0.2s;
  border:1.5px solid transparent;
  user-select:none;
}

.tags-bar .tag:hover{opacity:0.85}
.tags-bar .tag.active{
  background:var(--accent);
  color:#FFF;
  border-color:var(--accent);
}

/* ==========================================
   POST CARDS
   ========================================== */
.post-list{display:flex;flex-direction:column;gap:16px}

.post-card{
  background:var(--card-bg);
  border:1px solid var(--border-light);
  border-radius:var(--radius);
  padding:22px 24px;
  cursor:pointer;
  transition:all 0.25s;
  box-shadow:var(--shadow);
}

.post-card:hover{
  box-shadow:var(--shadow-hover);
  transform:translateY(-2px);
  border-color:var(--accent);
}

.post-card h3{
  font-family:var(--font-serif);
  font-size:1.2rem;
  color:var(--title);
  margin-bottom:4px;
}

.post-card .meta{
  font-size:0.85rem;
  color:var(--text-muted);
  margin-bottom:10px;
}

.post-card .preview{
  font-family:var(--font-serif);
  color:var(--text);
  font-size:0.95rem;
  line-height:1.8;
  opacity:0.8;
  margin-bottom:12px;
}

.post-card .card-tags{
  display:flex;flex-wrap:wrap;gap:6px;
}

.post-card .card-tags span{
  font-size:0.78rem;
  padding:3px 10px;
  border-radius:12px;
  background:var(--tag-bg);
  color:var(--tag-text);
}

.empty-state{
  text-align:center;padding:60px 20px;
  color:var(--text-muted);
  font-size:1.05rem;
}

.empty-state .icon{font-size:3rem;margin-bottom:12px;display:block}

/* ==========================================
   DETAIL PAGE
   ========================================== */
.back-link{
  display:inline-flex;align-items:center;gap:6px;
  color:var(--text-muted);font-size:0.9rem;
  margin-bottom:24px;
  padding:6px 12px;
  border-radius:var(--radius-sm);
  transition:all 0.2s;
}

.back-link:hover{background:var(--accent-soft);color:var(--accent)}

.detail-header{text-align:center;margin-bottom:32px}

.detail-header h1{
  font-family:var(--font-serif);
  font-size:2rem;
  color:var(--title);
  margin-bottom:6px;
}

.detail-header .meta{
  color:var(--text-muted);
  font-size:0.9rem;
}

.detail-header .detail-tags{
  display:flex;flex-wrap:wrap;gap:6px;
  justify-content:center;
  margin-top:14px;
}

.detail-header .detail-tags span{
  font-size:0.8rem;padding:4px 12px;border-radius:14px;
  background:var(--tag-bg);color:var(--tag-text);
  cursor:pointer;transition:all 0.2s;
}

.detail-header .detail-tags span:hover{
  background:var(--accent);color:#FFF;
}

/* Poem content */
.poem-content{
  max-width:520px;
  margin:0 auto 40px;
  text-align:center;
}

.poem-content p{
  font-family:var(--font-serif);
  font-size:1.3rem;
  color:var(--title);
  line-height:2.2;
  letter-spacing:0.04em;
}

/* Article content (for future use) */
.article-content{
  max-width:680px;
  margin:0 auto 40px;
}

.article-content p{
  font-size:1rem;
  color:var(--text);
  line-height:1.9;
  margin-bottom:16px;
  text-indent:2em;
}

/* ==========================================
   WORKS PAGE
   ========================================== */
.page-title{
  font-family:var(--font-serif);
  font-size:1.8rem;
  color:var(--title);
  text-align:center;
  margin-bottom:8px;
}

.page-subtitle{
  text-align:center;color:var(--text-muted);
  margin-bottom:32px;font-size:0.95rem;
}

.works-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:20px;
}

.work-card{
  background:var(--card-bg);
  border:1px solid var(--border-light);
  border-radius:var(--radius);
  padding:24px;
  box-shadow:var(--shadow);
  transition:all 0.25s;
  display:flex;flex-direction:column;gap:12px;
}

.work-card:hover{
  box-shadow:var(--shadow-hover);
  transform:translateY(-2px);
  border-color:var(--accent);
}

.work-card .work-icon{
  font-size:2.2rem;
  width:52px;height:52px;
  display:flex;align-items:center;justify-content:center;
  background:var(--accent-soft);
  border-radius:var(--radius-sm);
  color:var(--accent);
}

.work-card h3{
  font-family:var(--font-serif);
  font-size:1.15rem;
  color:var(--title);
}

.work-card p{font-size:0.88rem;color:var(--text-muted);line-height:1.6}

.work-card .btn{
  display:inline-flex;align-items:center;gap:6px;
  align-self:flex-start;
  padding:8px 18px;
  border-radius:var(--radius-sm);
  background:var(--accent);
  color:#FFF;
  font-size:0.88rem;
  font-weight:500;
  transition:all 0.2s;
  text-decoration:none;
  margin-top:auto;
}

.work-card .btn:hover{
  background:var(--accent-hover);
  color:#FFF;
  transform:translateX(2px);
}

/* ==========================================
   ABOUT PAGE
   ========================================== */
.about-section{
  max-width:600px;
  margin:0 auto;
}

.about-card{
  background:var(--card-bg);
  border:1px solid var(--border-light);
  border-radius:var(--radius);
  padding:28px 30px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
}

.about-card h2{
  font-family:var(--font-serif);
  font-size:1.3rem;
  color:var(--title);
  margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}

.about-card p{color:var(--text);line-height:1.8;font-size:0.95rem}

.about-card code{
  background:var(--accent-soft);
  color:var(--accent);
  padding:3px 10px;
  border-radius:6px;
  font-size:0.9rem;
  font-family:inherit;
}

.gh-links{
  display:flex;flex-direction:column;gap:12px;
  margin-top:8px;
}

.gh-link{
  display:flex;align-items:center;gap:12px;
  padding:14px 18px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border-light);
  background:var(--bg-soft);
  transition:all 0.2s;
  color:var(--text);
  text-decoration:none;
}

.gh-link:hover{
  border-color:var(--accent);
  background:var(--accent-soft);
}

.gh-link .gh-avatar{
  width:40px;height:40px;
  border-radius:50%;
  background:var(--accent-soft);
  color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:1.1rem;
  flex-shrink:0;
}

.gh-link .gh-info strong{
  color:var(--title);
  font-size:1rem;
}

.gh-link .gh-info span{
  color:var(--text-muted);
  font-size:0.85rem;
}

/* ==========================================
   FOOTER
   ========================================== */
footer{
  text-align:center;padding:24px;
  color:var(--text-muted);font-size:0.82rem;
  border-top:1px solid var(--border-light);
}

/* ==========================================
   ANIMATIONS
   ========================================== */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}

.fade-up{animation:fadeUp 0.4s ease-out}

/* ==========================================
   RESPONSIVE
   ========================================== */
@media(max-width:640px){
  nav{padding:0 16px}
  .nav-brand{font-size:1.15rem}
  .nav-links{display:none}
  .nav-links.open{
    display:flex;flex-direction:column;
    position:absolute;top:var(--nav-height);
    left:0;right:0;
    background:var(--nav-bg);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border-light);
    padding:12px 16px;
    gap:4px;
  }
  .nav-links.open a{width:100%;text-align:center}
  .menu-btn{display:block}

  main{padding:24px 16px 60px}

  .home-header h1{font-size:1.5rem}
  .post-card{padding:16px 18px}
  .post-card h3{font-size:1.05rem}
  .works-grid{grid-template-columns:1fr}

  .poem-content p{font-size:1.1rem;line-height:2}
  .detail-header h1{font-size:1.5rem}
}
</style>
</head>

/* 收集所有标签 */
const allTags = [...new Set(posts.flatMap(p=>p.tags))].sort();

/* ==========================================
   THEME
   ========================================== */
function getTheme(){return localStorage.getItem('theme')||'light'}
function setTheme(t){
  localStorage.setItem('theme',t);
  document.documentElement.setAttribute('data-theme',t);
  const btn = document.getElementById('theme-toggle');
  btn.textContent = t==='dark'?'☀️':'🌙';
  btn.setAttribute('aria-label',t==='dark'?'切换亮色主题':'切换暗色主题');
}
function toggleTheme(){
  setTheme(getTheme()==='dark'?'light':'dark');
}

/* ==========================================
   ROUTER
   ========================================== */
let currentFilter = null; /* {type:'tag'|'category'|'search', value} */

function parseHash(){
  const h = location.hash.replace('#','') || '/';
  if(h==='/') return {page:'home'};
  if(h.startsWith('/poem/')) return {page:'detail',id:parseInt(h.split('/')[2])};
  if(h.startsWith('/tag/')) return {page:'tag',value:decodeURIComponent(h.split('/').slice(2).join('/'))};
  if(h.startsWith('/category/')) return {page:'category',value:decodeURIComponent(h.split('/').slice(2).join('/'))};
  if(h==='/works') return {page:'works'};
  if(h==='/about') return {page:'about'};
  return {page:'home'};
}

function navigate(e,path){
  if(e){e.preventDefault()}
  if(path==='/') currentFilter = null;
  location.hash = path;
  closeMenu();
}

/* ==========================================
   RENDER — 渲染引擎
   ========================================== */
function render(){
  const route = parseHash();
  const app = document.getElementById('app');
  const links = document.querySelectorAll('.nav-links a');

  const isHomeView = route.page==='home'||route.page==='tag'||route.page==='category';
  links.forEach(a=>{
    const href = a.getAttribute('data-route');
    a.classList.toggle('active', isHomeView ? href==='/' : href===('/'+route.page));
  });

  switch(route.page){
    case 'home': app.innerHTML = renderHome(); break;
    case 'detail': app.innerHTML = renderDetail(route.id); break;
    case 'tag': app.innerHTML = renderFiltered('tag',route.value); break;
    case 'category': app.innerHTML = renderFiltered('category',route.value); break;
    case 'works': app.innerHTML = renderWorks(); break;
    case 'about': app.innerHTML = renderAbout(); break;
    default: app.innerHTML = renderHome();
  }

  /* 重新绑定搜索事件 */
  const input = document.getElementById('searchInput');
  if(input){
    input.addEventListener('input',debounce(onSearch,200));
  }
}

/* ==========================================
   PAGES
   ========================================== */
function renderHome(){
  const filtered = getFilteredPosts();
  const tagsHtml = allTags.map(t=>{
    const active = currentFilter && currentFilter.type==='tag' && currentFilter.value===t;
    return `<span class="tag${active?' active':''}" onclick="filterByTag('${t}')">${t}</span>`;
  }).join('');

  let listHtml = '';
  if(filtered.length===0){
    listHtml = `<div class="empty-state fade-up"><span class="icon">📭</span>没有找到匹配的诗词</div>`;
  }else{
    listHtml = filtered.map(p=>`
      <div class="post-card fade-up" onclick="navigate(null,'/poem/${p.id}')">
        <h3>${p.title}</h3>
        <div class="meta">${p.author} · ${p.date} · ${p.category}</div>
        <div class="preview">${p.content.slice(0,2).join('<br>')}${p.content.length>2?'<br>…':''}</div>
        <div class="card-tags">${p.tags.map(t=>`<span>${t}</span>`).join('')}</div>
      </div>
    `).join('');
  }

  const activeFilterLabel = currentFilter
    ? `<div style="text-align:center;margin-bottom:16px">
        <span style="color:var(--text-muted);font-size:0.9rem">筛选：</span>
        <span style="color:var(--accent);font-weight:500">${currentFilter.label}</span>
        <a href="#/" style="margin-left:8px;font-size:0.85rem;cursor:pointer" onclick="clearFilter()">✕ 清除</a>
      </div>`
    : '';

  return `
    <div class="home-header fade-up">
      <h1>诗词雅集</h1>
      <p>共收录 ${posts.length} 首诗词，品味千年文脉</p>
    </div>
    <div class="search-wrap fade-up">
      <span class="search-icon">🔍</span>
      <input id="searchInput" type="text" placeholder="搜索标题、作者、内容..." value="${currentFilter&&currentFilter.type==='search'?currentFilter.value:''}">
    </div>
    <div class="tags-bar fade-up">${tagsHtml}</div>
    ${activeFilterLabel}
    <div class="post-list">${listHtml}</div>
  `;
}

function renderDetail(id){
  const p = posts.find(x=>x.id===id);
  if(!p) return `<div class="empty-state"><span class="icon">😕</span>未找到该诗词<br><a href="#/">返回首页</a></div>`;

  const isPoem = p.type==='诗'||p.type==='词'||p.type==='古诗';
  const contentHtml = p.content.map(line=>`<p>${line}</p>`).join('');
  const contentCls = isPoem?'poem-content':'article-content';

  return `
    <a href="#/" class="back-link fade-up" onclick="navigate(event,'/')">← 返回列表</a>
    <div class="detail-header fade-up">
      <h1>${p.title}</h1>
      <div class="meta">${p.author} · ${p.date} · ${p.category}</div>
      <div class="detail-tags">
        ${p.tags.map(t=>`<span onclick="filterByTag('${t}')">${t}</span>`).join('')}
      </div>
    </div>
    <div class="${contentCls} fade-up">${contentHtml}</div>
  `;
}

function renderFiltered(type,value){
  currentFilter = {type,value,label:value};
  return renderHome();
}

function renderWorks(){
  const cardsHtml = works.map((w,i)=>`
    <div class="work-card fade-up" style="animation-delay:${i*0.06}s">
      <div class="work-icon">${w.icon}</div>
      <h3>${w.title}</h3>
      <p>${w.desc}</p>
      <a href="${w.url}" target="_blank" class="btn">${w.isMore?'前往主页':'开始体验'} →</a>
    </div>
  `).join('');

  return `
    <h1 class="page-title fade-up">经典作品</h1>
    <p class="page-subtitle fade-up">一些精心打造的小程序与游戏作品</p>
    <div class="works-grid">${cardsHtml}</div>
  `;
}

      </div>

/* ==========================================
   FILTER & SEARCH
   ========================================== */
function getFilteredPosts(){
  let result = [...posts];
  if(currentFilter){
    if(currentFilter.type==='tag'){
      result = result.filter(p=>p.tags.includes(currentFilter.value));
    }else if(currentFilter.type==='category'){
      result = result.filter(p=>p.category===currentFilter.value);
    }else if(currentFilter.type==='search'){
      const q = currentFilter.value.toLowerCase();
      result = result.filter(p=>
        p.title.toLowerCase().includes(q)||
        p.author.toLowerCase().includes(q)||
        p.content.join('').toLowerCase().includes(q)||
        p.tags.some(t=>t.toLowerCase().includes(q))
      );
    }
  }
  return result;
}

function filterByTag(tag){
  location.hash = '#/tag/'+encodeURIComponent(tag);
}

function clearFilter(){
  currentFilter = null;
  location.hash = '#/';
}

function renderPostList(container){
  const filtered = getFilteredPosts();
  if(filtered.length===0){
    container.innerHTML = `<div class="empty-state"><span class="icon">📭</span>没有找到匹配的诗词</div>`;
  }else{
    container.innerHTML = filtered.map(p=>`
      <div class="post-card fade-up" onclick="navigate(null,'/poem/${p.id}')">
        <h3>${p.title}</h3>
        <div class="meta">${p.author} · ${p.date} · ${p.category}</div>
        <div class="preview">${p.content.slice(0,2).join('<br>')}${p.content.length>2?'<br>…':''}</div>
        <div class="card-tags">${p.tags.map(t=>'<span>'+t+'</span>').join('')}</div>
      </div>
    `).join('');
  }
}

function renderFilterLabel(container){
  let el = document.getElementById('filterLabel');
  if(currentFilter && currentFilter.type==='search'){
    if(!el){
      el = document.createElement('div');
      el.id = 'filterLabel';
      el.style.cssText = 'text-align:center;margin-bottom:16px';
      container.parentNode.insertBefore(el, container);
    }
    el.innerHTML = `<span style="color:var(--text-muted);font-size:0.9rem">筛选：</span>
      <span style="color:var(--accent);font-weight:500">${currentFilter.label}</span>
      <a href="#/" style="margin-left:8px;font-size:0.85rem;cursor:pointer" onclick="event.preventDefault();clearFilter()">✕ 清除</a>`;
  }else{
    if(el) el.remove();
  }
}

function onSearch(e){
  const q = e.target.value.trim();
  if(q){
    currentFilter = {type:'search',value:q,label:'搜索：'+q};
  }else{
    currentFilter = null;
  }
  const list = document.querySelector('.post-list');
  if(list){
    renderPostList(list);
    renderFilterLabel(list);
  }
}

function debounce(fn,ms){
  let timer;
  return function(...args){
    clearTimeout(timer);
    timer = setTimeout(()=>fn.apply(this,args),ms);
  };
}

/* ==========================================
   MOBILE MENU
   ========================================== */
function toggleMenu(){
  document.getElementById('navLinks').classList.toggle('open');
}
function closeMenu(){
  document.getElementById('navLinks').classList.remove('open');
}

/* ==========================================
   INIT
   ========================================== */
function init(){
  setTheme(getTheme());
  window.addEventListener('hashchange',render);
  render();
}

document.addEventListener('DOMContentLoaded',init);
</script>
