    ctx.fillRect(px + psW*0.16, py + psH*0.22, psW*0.14, psH*0.16);
    ctx.fillRect(px + psW*0.56, py + psH*0.22, psW*0.14, psH*0.16);
    ctx.fillStyle = '#000';
    ctx.fillRect(px + psW*0.19, py + psH*0.26, psW*0.07, psH*0.08);
    ctx.fillRect(px + psW*0.59, py + psH*0.26, psW*0.07, psH*0.08);
    // Crouch indicator
    if (sp.crouching) {
      ctx.strokeStyle = '#ff0'; ctx.lineWidth = 2*scale;
      ctx.setLineDash([4*scale, 4*scale]);
      ctx.strokeRect(px - 2*scale, py - 2*scale, psW + 4*scale, psH + 4*scale);
      ctx.setLineDash([]);
    }
    ctx.restore();

    // Dust
    this.drawStoryDust(scale);
  }

  drawStoryInterior(scale) {
    const ctx = this.ctx, w = this.canvas.width, h = this.canvas.height;

    // Dark warm interior
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#0a0505'); grad.addColorStop(0.5, '#1a0a08');
    grad.addColorStop(1, '#0d0604');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);

    // Stone wall texture
    ctx.strokeStyle = 'rgba(60,40,30,0.2)'; ctx.lineWidth = 1;
    for (let y = 20*scale; y < 700*scale; y += 40*scale) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
    for (let x = 0; x < w; x += 60*scale) {
      const offset = (Math.floor(x / (60*scale)) % 2) * 20*scale;
      ctx.beginPath(); ctx.moveTo(x, 20*scale); ctx.lineTo(x + offset, 700*scale); ctx.stroke();
    }

    // Wooden floor
    const fy = 840 * scale;
    ctx.fillStyle = '#3a2010'; ctx.fillRect(0, fy, w, h - fy);
    for (let x = 0; x < w; x += 30*scale) {
      ctx.strokeStyle = 'rgba(80,50,20,0.3)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, fy); ctx.lineTo(x, h); ctx.stroke();
    }
    ctx.strokeStyle = '#5a3020'; ctx.lineWidth = 3*scale;
    ctx.beginPath(); ctx.moveTo(0, fy); ctx.lineTo(w, fy); ctx.stroke();

    // Torch light glow
    for (const tx of [200*scale, 1720*scale]) {
      const glow = ctx.createRadialGradient(tx, 200*scale, 0, tx, 300*scale, 350*scale);
      glow.addColorStop(0, 'rgba(255,140,30,0.2)'); glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow; ctx.fillRect(tx - 350*scale, 0, 700*scale, 500*scale);
    }

    // Three stone doors
    for (let di = 0; di < this.storyDoors.length; di++) {
      const d = this.storyDoors[di];
      const done = this.mathDoorsDone[di] || this.physicsDoorsDone[di] || this.chemDoorsDone[di];
      const dx = d.x * scale, dy = d.y * scale, dw = d.w * scale, dh = d.h * scale;
      const isNear = this.storyDoorSelected === this.storyDoors.indexOf(d) && this.storyDoorAnimating;
      const glowPulse = isNear ? 1.5 : (0.6 + Math.sin(this.time * 2 + this.storyDoors.indexOf(d)) * 0.2);

      // Door frame (stone arch)
      ctx.fillStyle = '#2a1a10';
      ctx.fillRect(dx - 15*scale, dy - 10*scale, dw + 30*scale, dh + 20*scale);
      // Arch
      ctx.fillStyle = '#1a0a05';
      ctx.beginPath();
      ctx.moveTo(dx, dy + dh);
      ctx.lineTo(dx, dy + dw*0.5);
      ctx.arc(dx + dw/2, dy + dw*0.5, dw/2, Math.PI, 0);
      ctx.lineTo(dx + dw, dy + dh);
      ctx.fill();

      // Glowing border
      ctx.strokeStyle = d.color;
      ctx.lineWidth = (2 + glowPulse) * scale;
      ctx.shadowColor = d.color;
      ctx.shadowBlur = 12 * scale * glowPulse;
      ctx.beginPath();
      ctx.moveTo(dx, dy + dh);
      ctx.lineTo(dx, dy + dw*0.5);
      ctx.arc(dx + dw/2, dy + dw*0.5, dw/2, Math.PI, 0);
      ctx.lineTo(dx + dw, dy + dh);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Door label
      ctx.fillStyle = d.color;
      ctx.shadowColor = d.color;
      ctx.shadowBlur = 8 * scale * glowPulse;
      ctx.font = `900 ${Math.round(36*scale)}px Orbitron, monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(d.icon, dx + dw/2, dy + 40*scale);
      ctx.font = `900 ${Math.round(18*scale)}px Orbitron, monospace`;
      ctx.fillText(d.name, dx + dw/2, dy + dh + 30*scale);
      ctx.shadowBlur = 0;
      ctx.textAlign = 'start';

      // Completed door overlay
      if (done) {
        ctx.fillStyle = 'rgba(0,255,100,0.15)';
        ctx.fillRect(dx - 15*scale, dy - 10*scale, dw + 30*scale, dh + 20*scale);
        ctx.fillStyle = '#0f0'; ctx.shadowColor = '#0f0'; ctx.shadowBlur = 10*scale;
        ctx.font = `900 ${Math.round(14*scale)}px Orbitron, monospace`;
        ctx.textAlign = 'center';
        ctx.fillText('已完成', dx + dw/2, dy + dh + 55*scale);
        ctx.shadowBlur = 0; ctx.textAlign = 'start';
      }
      // Hint text when narration done and near door
      if (this.storyHouseNarrationDone && !this.storyDoorAnimating && !done) {
        const sip = this.storyInteriorPlayer;
        if (sip.x + 44 > d.x && sip.x < d.x + d.w && sip.y + 44 > d.y) {
          ctx.fillStyle = '#fff';
          ctx.globalAlpha = 0.5 + Math.sin(this.time * 3) * 0.3;
          ctx.font = `${Math.round(13*scale)}px Orbitron, monospace`;
          ctx.textAlign = 'center';
          ctx.fillText('按 SHIFT 进入', dx + dw/2, dy + dh + 55*scale);
          ctx.textAlign = 'start';
          ctx.globalAlpha = 1;
        }
      }
    }

    // Player in interior
    const sip = this.storyInteriorPlayer;
    // Portal (appears when all 3 doors are done)
    var allDoorsDone = this.mathDoorsDone[0] && this.physicsDoorsDone[1] && this.chemDoorsDone[2];
    if (allDoorsDone) {
      var portalX = 960*scale, portalY = 600*scale, portalR = 50*scale;
      var portalPulse = 0.6+Math.sin(this.time*3)*0.4;
      ctx.strokeStyle='#0ff'; ctx.lineWidth=4*scale; ctx.shadowColor='#0ff'; ctx.shadowBlur=30*scale*portalPulse;
      ctx.beginPath(); ctx.arc(portalX, portalY, portalR, 0, Math.PI*2); ctx.stroke();
      ctx.strokeStyle='#f0f'; ctx.lineWidth=3*scale; ctx.shadowColor='#f0f'; ctx.shadowBlur=20*scale*portalPulse;
      ctx.beginPath(); ctx.arc(portalX, portalY, portalR*0.7, 0, Math.PI*2); ctx.stroke();
      var glowGrad = ctx.createRadialGradient(portalX, portalY, 0, portalX, portalY, portalR);
      glowGrad.addColorStop(0, 'rgba(0,255,255,0.5)'); glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle=glowGrad; ctx.beginPath(); ctx.arc(portalX, portalY, portalR, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle='#0ff'; ctx.font='900 '+Math.round(18*scale)+'px Orbitron, monospace'; ctx.textAlign='center';
      ctx.fillText('传送阵',portalX,portalY+portalR+30*scale);
      ctx.fillText('最终决战',portalX,portalY+portalR+52*scale);
      ctx.textAlign='start';
      if (this.storyPhase>=6 && sip.x+44>960-40 && sip.x<960+40 && sip.y+44>600-40 && sip.y<600+40) {
        ctx.fillStyle='#fff'; ctx.font=Math.round(14*scale)+'px Orbitron, monospace'; ctx.textAlign='center';
        ctx.fillText('按 Shift 进入传送阵',portalX,portalY+portalR+75*scale); ctx.textAlign='start';
      }
    }
    if (this.storyPhase >= 5) {
      const psW = 44 * scale, psH = (sip.h || 44) * scale;
      const px = sip.x * scale, py = sip.y * scale;
      const alpha = this.storyDoorAnimating ? Math.max(0, 1 - this.storyDoorAnimTimer / 0.6) : 1;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#0cf'; ctx.shadowColor = '#0ff'; ctx.shadowBlur = 12*scale;
      ctx.fillRect(px, py, psW, psH);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2*scale; ctx.strokeRect(px, py, psW, psH);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.fillRect(px + psW*0.2, py + psH*0.25, psW*0.12, psH*0.12);
      ctx.fillRect(px + psW*0.55, py + psH*0.25, psW*0.12, psH*0.12);
      if (sip.crouching) {
        ctx.strokeStyle = '#ff0'; ctx.lineWidth = 2*scale;
        ctx.setLineDash([4*scale, 4*scale]);
        ctx.strokeRect(px - 2*scale, py - 2*scale, psW + 4*scale, psH + 4*scale);
        ctx.setLineDash([]);
      }
      ctx.globalAlpha = 1;
    }

    // Narration overlay
    if (this.storyPhase === 5 && !this.storyHouseNarrationDone) {
      ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#ffd080'; ctx.textAlign = 'center';
      ctx.font = `${Math.round(17*scale)}px Orbitron, monospace`;
      ctx.fillText('「只要通过三道石门，', w/2, h * 0.25);
      ctx.fillText('这座小屋就会赐予你直面三角形国王的机会」', w/2, h * 0.25 + 30*scale);
      ctx.textAlign = 'start';
    }
  }

  drawStoryQuestionMark(scale) {
    const ctx = this.ctx, w = this.canvas.width, h = this.canvas.height;
    // Sky (same as falling scene)
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#3a6aaa'); grad.addColorStop(0.7, '#6abafa');
    grad.addColorStop(1, '#4a8a3a');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
    // Clouds
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    for (let i = 0; i < 4; i++) {
      const cx = ((i * 400 + 80) * scale) % w, cy = (100 + i * 90) * scale;
      ctx.beginPath(); ctx.arc(cx, cy, 30*scale, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 22*scale, cy - 8*scale, 24*scale, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx - 18*scale, cy + 4*scale, 20*scale, 0, Math.PI*2); ctx.fill();
    }
    // Ground
    const gy = 850 * scale;
    ctx.fillStyle = '#3a7a2a'; ctx.fillRect(0, gy, w, h - gy);
    ctx.fillStyle = '#5aaa3a'; ctx.fillRect(0, gy, w, 5*scale);
    // House on the right
    const hx = 1480 * scale, hy = 520 * scale, hw = 440 * scale, hh = 330 * scale;
    ctx.fillStyle = '#6b4c3a'; ctx.fillRect(hx, hy, hw, hh);
    ctx.strokeStyle = '#4a3020'; ctx.lineWidth = 2*scale; ctx.strokeRect(hx, hy, hw, hh);
    // Roof
    ctx.fillStyle = '#3a2010'; ctx.beginPath();
    ctx.moveTo(hx - 30*scale, hy); ctx.lineTo(hx + hw/2, hy - 100*scale);
    ctx.lineTo(hx + hw + 30*scale, hy); ctx.fill();
    ctx.strokeStyle = '#2a1000'; ctx.stroke();
    // Doorway
    const dx = hx + hw/2 - 40*scale, dy = hy + hh - 100*scale;
    ctx.fillStyle = '#1a0a00'; ctx.fillRect(dx, dy, 80*scale, 100*scale);
    ctx.strokeStyle = '#4a3020'; ctx.lineWidth = 2*scale; ctx.strokeRect(dx, dy, 80*scale, 100*scale);
    // Window
    ctx.fillStyle = '#8cf'; ctx.fillRect(hx + 50*scale, hy + 50*scale, 60*scale, 60*scale);
    ctx.strokeStyle = '#4a3020'; ctx.lineWidth = 2*scale; ctx.strokeRect(hx + 50*scale, hy + 50*scale, 60*scale, 60*scale);

    // === PLAYER ===
    const sp = this.storyPlayer;
    const psW = 44 * scale, psH = (sp.h || 44) * scale;
    const px = sp.x * scale, py = sp.y * scale;
    // Outer glow
    ctx.save();
    ctx.shadowColor = '#0ff'; ctx.shadowBlur = 20 * scale;
    ctx.fillStyle = 'rgba(0,255,255,0.25)';
    ctx.fillRect(px - 4*scale, py - 4*scale, psW + 8*scale, psH + 8*scale);
    ctx.restore();
    // Body
    ctx.fillStyle = '#0cf';
    ctx.fillRect(px, py, psW, psH);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5*scale;
    ctx.strokeRect(px, py, psW, psH);
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.fillRect(px + psW*0.16, py + psH*0.22, psW*0.14, psH*0.16);
    ctx.fillRect(px + psW*0.56, py + psH*0.22, psW*0.14, psH*0.16);
    ctx.fillStyle = '#000';
    ctx.fillRect(px + psW*0.19, py + psH*0.26, psW*0.07, psH*0.08);
    ctx.fillRect(px + psW*0.59, py + psH*0.26, psW*0.07, psH*0.08);
    // Crouch indicator
    if (sp.crouching) {
      ctx.strokeStyle = '#ff0'; ctx.lineWidth = 2*scale;
      ctx.setLineDash([4*scale, 4*scale]);
      ctx.strokeRect(px - 2*scale, py - 2*scale, psW + 4*scale, psH + 4*scale);
      ctx.setLineDash([]);
    }

    // Question mark above player (fade in/out)
    const qAlpha = Math.min(1, this.storyTimer < 0.3 ? this.storyTimer / 0.3 : (this.storyTimer > 1.7 ? (2.0 - this.storyTimer) / 0.3 : 1));
    ctx.save();
    ctx.globalAlpha = qAlpha;
    ctx.fillStyle = '#ff0';
    ctx.shadowColor = '#ff0'; ctx.shadowBlur = 22*scale;
    const qSize = Math.round(44*scale);
    ctx.font = `900 ${qSize}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('?', px + psW/2, py - 22*scale);
    ctx.restore();

    // Dust particles
    this.drawStoryDust(scale);
  }

  drawStory(time, scale) {
    switch (this.storyPhase) {
      case 0: this.drawStoryBlackScreen(scale); break;
      case 1: this.drawStoryFalling(scale); break;
      case 2: this.drawStoryQuestionMark(scale); break;
      case 3: this.drawStoryExploration(scale); break;
      case 4: this.drawStoryBlackScreen(scale); break;
      case 5: case 6: this.drawStoryInterior(scale); break;
    }
  }

  // ==================== MATH TRIAL SYSTEM ====================
  startMathEntry() {
    this.mathEntryPhase = 0; this.mathEntryTimer = 0; this.mathEntryAlpha = 0;
  }

  updateMathEntry(dt) {
    this.mathEntryTimer += dt;
    if (this.mathEntryPhase === 0) { // Black screen
      if (this.mathEntryTimer > 0.6) { this.mathEntryPhase = 1; this.mathEntryTimer = 0; }
    } else if (this.mathEntryPhase === 1) { // Text fade in
      this.mathEntryAlpha = Math.min(1, this.mathEntryTimer / 1.0);
      if (this.mathEntryTimer > 1.5) { this.mathEntryPhase = 2; this.mathEntryTimer = 0; }
    } else if (this.mathEntryPhase === 2) { // Hold
      if (this.mathEntryTimer > 1.2) { this.mathEntryPhase = 3; this.mathEntryTimer = 0; }
    } else if (this.mathEntryPhase === 3) { // Text fade out
      this.mathEntryAlpha = Math.max(0, 1 - this.mathEntryTimer / 1.0);
      if (this.mathEntryTimer > 1.2) { this.mathEntryPhase = 4; }
    }
  }

  drawMathEntry(scale) {
    const ctx = this.ctx, w = this.canvas.width, h = this.canvas.height;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
    if (this.mathEntryPhase >= 1 && this.mathEntryPhase <= 3) {
      var isPhysics = this.physicsActive;
      var isChem = this.chemActive;
      var lv = isChem ? CHEM_LEVELS[this.chemLevel] : (isPhysics ? PHYSICS_LEVELS[this.physicsLevel] : MATH_LEVELS[this.mathLevel]);
      var doorName = isChem ? '化 学 石 门' : (isPhysics ? '物 理 石 门' : '数 学 石 门');
      var lvlText = isChem ? 'BOSS: '+lv.name : ('第'+(isPhysics?this.physicsLevel:this.mathLevel+1)+'关: '+lv.name);
      ctx.save();
      ctx.globalAlpha = this.mathEntryAlpha;
      ctx.fillStyle = '#0cf';
      ctx.shadowColor = '#0ff'; ctx.shadowBlur = 30 * scale;
      ctx.font = `900 ${Math.round(56*scale)}px Orbitron, monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(doorName, w/2, h * 0.4);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = `${Math.round(22*scale)}px Orbitron, monospace`;
      ctx.fillText(lvlText, w/2, h * 0.52);
      ctx.restore();
    }
  }

  loadMathLevel() {
    if (this._mathCompleteTimeout) { clearTimeout(this._mathCompleteTimeout); this._mathCompleteTimeout = null; }
    const lv = MATH_LEVELS[this.mathLevel];
    if (lv.type === 'platform') {
      this.currentLevel = 0;
      LEVELS[0] = lv;
      this.loadLevel(0);
      this.switchStates = (lv.switches||[]).map(()=>false);
      this.doorStates = (lv.doors||[]).map(()=>true);
      // Set up moving platforms for math level
      this.movingPlatforms = (lv.movingPlatforms||[]).map(mp=>({...mp,currentY:mp.y,currentX:mp.x,baseX:mp.x,baseY:mp.y}));
      // Set up crates if any
      this.crates = (lv.crates||[]).map(c=>({...c,vx:0,vy:0,onGround:false}));
      // Reset mod orbs
      this.mathModValue = 0;
      this.collectedOrbs = (lv.modOrbs||[]).map(()=>false);
      // Reset set zones
      this.mathSetTimer = 0; this.mathSetSafe = true;
      // Reset missiles
      this._mathMissiles = []; this._missileTimer = 0;
    } else if (lv.type === 'dice') {
      this.mathDiceRoll = 0; this.mathDiceCount = 0; this.mathDiceRolling = false;
    } else if (lv.type === 'boss') {
      this.mathBossHP = lv.bossHP;
      this.initBossState();
    }
    this.updateUI();
    document.getElementById('lvl-num').textContent = '数学 '+(this.mathLevel+1)+'/'+MATH_LEVELS.length;
    document.getElementById('level-name').textContent = lv.name;
  }

  completeMathLevel() {
    if (this.mathLevel < MATH_LEVELS.length - 1) {
      this.mathLevel++;
      this.state = 'mathEntry';
      this.startMathEntry();
      this.loadMathLevel();
    } else {
      // Boss defeated!
      this.mathActive = false;
      this.mathDoorsDone[0] = true;
      this.state = 'story';
      this.storyPhase = 6;
      this.storyTimer = 0;
      this.storyDoorSelected = -1;
      this.storyDoorAnimating = false;
      this.storyDoorAnimTimer = 0;
      this.storyInteriorPlayer = { x: 400, y: 826, vx: 0, vy: 0, onGround: true, facing: 1, normalH: 44, crouchH: 22, h: 44, crouching: false };
      this.showHUD();
      document.getElementById('lvl-num').textContent = '';
      document.getElementById('level-name').textContent = '数学试炼完成!';
      document.getElementById('progress').innerHTML = '';
      this.audio.sfxLevelComplete();
    }
  }

  updateMathPlaying(dt) {
    const lv = MATH_LEVELS[this.mathLevel];
    if (lv.type === 'platform') {
      // Use existing platformer physics
      this.updatePhysics(dt);
      // particles disabled;
      // Check for prime/platform safety + platform hazards
      const p = this.player;
      if (lv.platforms) {
        for (const plat of lv.platforms) {
          if (plat.safe === false && this.playerOnPlatform(plat)) {
            this.die(); return;
          }
        }
      }
      if (lv.platformHazards) {
        for (const h of lv.platformHazards) {
          if (p.x+44>h.x && p.x<h.x+h.w && p.y+p.h>h.y && p.y<h.y+h.h) {
            this.die(); return;
          }
        }
      }
      // Check mod orbs
      if (lv.modOrbs) {
        for (let i = 0; i < lv.modOrbs.length; i++) {
          if (this.collectedOrbs[i]) continue;
          const orb = lv.modOrbs[i];
          if (Math.abs(p.x+22-orb.x)<24 && Math.abs(p.y+22-orb.y)<24) {
            this.collectedOrbs[i] = true;
            this.mathModValue += orb.v;
            this.audio.sfxOrb();
            this.particles.emit(orb.x, orb.y, 12, '#88ffff', 3, 0.5, 2);
          }
        }
      }
      // Check set zones
      if (lv.setZones) {
        let inSafeZone = false;
        let inAnyZone = false;
        for (const zone of lv.setZones) {
          if (p.x+44>zone.x && p.x<zone.x+zone.w && p.y+44>zone.y && p.y<zone.y+zone.h) {
            inAnyZone = true;
            // Intersection = where blue(A) and red(B) overlap
            for (const z2 of lv.setZones) {
              if (z2.set !== zone.set && p.x+44>z2.x && p.x<z2.x+z2.w && p.y+44>z2.y && p.y<z2.y+z2.h) {
                inSafeZone = true; break;
              }
            }
          }
        }
        this.mathSetSafe = !inAnyZone || inSafeZone;
        if (inAnyZone && !inSafeZone) {
          this.mathSetTimer += dt;
          if (this.mathSetTimer > 0.4) { this.die(); return; }
        } else { this.mathSetTimer = 0; }
      }
      // Check mod door
      if (lv.modTarget && lv.doors) {
        const p2 = this.player;
        const d = lv.doors[0];
        if (p2.x+44>d.x && p2.x<d.x+d.w && p2.y+44>d.y && p2.y<d.y+d.h) {
          if (this.mathModValue % lv.modTarget === 0 && this.mathModValue > 0) {
            this.doorStates[0] = false;
          } else {
            this.mathModValue = 0;
            this.collectedOrbs = (lv.modOrbs||[]).map(()=>false);
          }
        }
      }
      // Missile system for trig maze (Level 6)
      if (lv.missiles) {
        if (!this._mathMissiles) this._mathMissiles = [];
        // Spawn missiles periodically
        if (!this._missileTimer) this._missileTimer = 0;
        this._missileTimer += dt;
        if (this._missileTimer > 1.5) {
          this._missileTimer = 0;
          const startX = 700 + Math.random() * 1400;
          this._mathMissiles.push({
            x: startX, baseY: 400, amplitude: 150 + Math.random() * 200,
            period: 2.0 + Math.random() * 2.0, phase: Math.random() * Math.PI * 2,
            life: 8.0, vx: 80 + Math.random() * 120,
          });
        }
        // Update missiles
        for (const m of this._mathMissiles) {
          m.x += m.vx * dt;
          m.life -= dt;
          const missileY = m.baseY + Math.sin(this.time * 2 * Math.PI / m.period + m.phase) * m.amplitude;
          // Check collision with player
          if (Math.abs(p.x + 22 - m.x) < 18 && Math.abs(p.y + 22 - missileY) < 18) {
            this.die(); return;
          }
        }
        this._mathMissiles = this._mathMissiles.filter(m => m.life > 0 && m.x < 3200);
      }
      // Check exit
      const exit = lv.exit;
      if (exit && p.x+44>exit.x && p.x<exit.x+exit.w && p.y+44>exit.y && p.y<exit.y+exit.h) {
        this.completeMathLevel();
      }
    } else if (lv.type === 'dice') {
      // Dice rolling logic
      if (this.mathDiceRolling) {
        this.mathDiceRoll = Math.floor(Math.random() * lv.diceFaces) + 1;
        this.mathDiceCount++;
        this.mathDiceRolling = false;
        this.audio.sfxSwitch();
        if (this.mathDiceRoll === lv.diceFaces || this.mathDiceCount >= lv.autoPassAt) {
          this._mathCompleteTimeout = setTimeout(() => this.completeMathLevel(), 800);
        }
      }
    } else if (lv.type === 'boss') {
      // Player movement in boss arena
      const p2 = this.player;
      const BMOVE = 380;
      p2.vx = 0;
      if (this.keys['ArrowLeft'] || this.keys['KeyA']) p2.vx = -BMOVE;
      if (this.keys['ArrowRight'] || this.keys['KeyD']) p2.vx = BMOVE;
      const bjump = (this.keys['Space'] || this.keys['ArrowUp'] || this.keys['KeyW']);
      if (bjump && p2.onGround) {
        p2.vy = -620; p2.onGround = false; this.audio.sfxJump();
      } else if (bjump && p2.jumpsLeft > 1 && !this._bossJumpHeld) {
        p2.vy = -620 * 0.85; p2.jumpsLeft = 1; this.audio.sfxJump();
      }
      this._bossJumpHeld = bjump;
      p2.vy += 1400 * dt;
      p2.x += p2.vx * dt; p2.y += p2.vy * dt;
      if (p2.y >= 806) { p2.y = 806; p2.vy = 0; p2.onGround = true; p2.jumpsLeft = 2; }
      if (p2.x < 40) p2.x = 40;
      if (p2.x > 1880) p2.x = 1880;
      if (p2.y > 950) { this.die(); return; }
      // Check ground rifts
      for (const rift of this._groundRifts) {
        if (rift.active && p2.onGround && p2.x+44 > rift.x && p2.x < rift.x+rift.w) {
          this.die(); return;
        }
      }
      this.updateBoss(dt);
    }
  }

  playerOnPlatform(plat) {
    const p = this.player;
    return p.x+44>plat.x && p.x<plat.x+plat.w && Math.abs(p.y+p.h-plat.y)<5 && p.vy>=0 && p.onGround;
  }

  // ==================== BOSS SYSTEM ====================
  initBossState() {
    this._bossX = 960; this._bossY = 650; this._bossVX = 80; this._bossVY = 50;
    this._bossRotation = 0; this._bossAfterimages = [];
    this._bossInvuln = true; this._bossInvulnTimer = 4.0;
    this._bossPhase = 0; this._bossPhaseHP = 3;
    this._bossLastShot = 0; this._bossFlashTimer = 0;
    this._bossBullets = [];
    this._bossPowerups = []; this._powerupSpawnTimer = 8.0;
    this._bossShieldTimer = 0; this._bossCannonActive = false;
    this._bossCannonTimer = 0; this._bossDecoyActive = false;
    this._bossDecoyTimer = 0; this._bossSlowmoTimer = 0;
    this._bossCannonTargetPhase = -1;
    this._groundRifts = []; this._riftTimer = 8.0;
    this._bossDead = false; this._bossDeadTimer = 0; this._bossDeadY = 0; this._bossDeadRot = 0;
    this.audio.stopMusic(); this.audio.startBossMusic();
  }

  spawnBossBullet(angle, speed, type='circle', color='#f44', size=6) {
    this._bossBullets.push({
      x: this._bossX, y: this._bossY,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      type: type, color: color, size: size, life: 5.0
    });
  }

  spawnBossPowerup() {
    if (this._bossPowerups.length >= 1) return;
    const types = [
      {name:'π',color:'#ff0',type:'shield',weight:30},
      {name:'骰',color:'#f0f',type:'dice',weight:25},
      {name:'sin',color:'#0ff',type:'cannon',weight:20},
      {name:'i',color:'#fff',type:'decoy',weight:15},
      {name:'∞',color:'#8f8',type:'slowmo',weight:10},
    ];
    const totalW = types.reduce((s,t)=>s+t.weight,0);
    let r = Math.random()*totalW;
    let chosen = types[0];
    for (const t of types) { r -= t.weight; if (r <= 0) { chosen = t; break; } }
    this._bossPowerups.push({
      x: 200 + Math.random() * 1500, y: 700 + Math.random() * 100,
      ...chosen, life: 12.0, bobPhase: Math.random()*Math.PI*2
    });
    this._powerupSpawnTimer = 10.0 + Math.random() * 5.0;
  }

  collectPowerup(pu) {
    this.particles.emit(pu.x, pu.y, 20, pu.color, 4, 0.8, 3);
    this.audio.sfxOrb();
    if (pu.type === 'shield') {
      this._bossShieldTimer = 30.0;
      this.showMessage('π 护盾！30秒无敌', 1500);
    } else if (pu.type === 'dice') {
      const roll = Math.random();
      if (roll < 0.1) {
        this.mathBossHP = 0; this.audio.stopMusic();
        this._bossDead = true;
        this._bossDeadTimer = 0;
        this._bossDeadY = this._bossY;
        this._bossDeadRot = 0;
        this.showMessage('秒杀！混沌之王被概率吞噬！', 2000);
        this.particles.emit(this._bossX, this._bossY, 80, '#ff0', 10, 2, 8);
        return;
      } else if (roll < 0.6) {
        this._bossShieldTimer = 30.0;
        this.showMessage('骰子：护盾！30秒无敌', 1500);
      } else {
        this.showMessage('骰子：未中...', 1000);
      }
    } else if (pu.type === 'cannon') {
      this._bossCannonActive = true;
      this._bossCannonTimer = 0;
      this._bossCannonTargetPhase = Math.floor((this.mathBossHP - 1) / 3);
      this.showMessage('sin(x)曲率炮！自动清空当前阶段', 2000);
    } else if (pu.type === 'decoy') {
      this._bossDecoyActive = true;
      this._bossDecoyTimer = 15.0;
      this._bossDecoyX = pu.x; this._bossDecoyY = pu.y;
      this.showMessage('i 虚数诱饵！吸引弹幕15秒', 1500);
    } else if (pu.type === 'slowmo') {
      this._bossSlowmoTimer = 20.0;
      this.showMessage('∞ 时间膨胀！弹幕减速20秒', 1500);
    }
  }

  updateBoss(dt) {
    const p = this.player;
    // Death animation
    if (this._bossDead) {
      this._bossDeadTimer += dt;
      this._bossDeadRot = Math.min(0.5, this._bossDeadTimer * 0.8);
      this._bossDeadY += 600 * dt;
      if (this._bossDeadY >= 780 && !this._bossLanded) {
        this._bossLanded = true;
        this._bossDeadY = 780;
        this.audio.sfxLand();
        this.particles.emit(this._bossX, 850, 40, '#888', 3, 1.5, 5);
      }
      if (this._bossDeadTimer > 3.5) {
        this._bossDead = false; this._bossLanded = false;
        this.completeMathLevel();
      }
      return;
    }
    const slowmo = this._bossSlowmoTimer > 0 ? 0.35 : 1.0;
    this.mathBossTimer += dt;

    // Update timers
    if (this._bossShieldTimer > 0) this._bossShieldTimer -= dt;
    if (this._bossDecoyTimer > 0) { this._bossDecoyTimer -= dt; if (this._bossDecoyTimer <= 0) this._bossDecoyActive = false; }
    if (this._bossSlowmoTimer > 0) this._bossSlowmoTimer -= dt;
    if (this._bossInvulnTimer > 0) this._bossInvulnTimer -= dt;
    if (this._bossFlashTimer > 0) this._bossFlashTimer -= dt;

    // Determine current phase (0-3)
    const phaseHP = 3;
    const currentPhase = Math.floor((12 - this.mathBossHP) / phaseHP);
    if (currentPhase !== this._bossPhase && !this._bossCannonActive) {
      this._bossPhase = currentPhase;
      this._bossInvuln = true;
      this._bossInvulnTimer = 5.0 + currentPhase * 1.5;
      this._bossShieldTimer = 30.0;
      this._groundRifts = [];
      this._riftTimer = 0;
      this.showMessage('混沌之王进入第'+(currentPhase+1)+'阶段！护盾已激活', 2000);
    }

    // End invulnerability
    if (this._bossInvuln && this._bossInvulnTimer <= 0) {
      this._bossInvuln = false;
      this._bossWeakOpen = true;
      this.showMessage('弱点暴露！踩头攻击！', 1500);
    }

    // Boss movement
    const phaseSpeed = [0.7, 1.0, 1.4, 2.0];
    const spd = phaseSpeed[this._bossPhase];
    this._bossX += Math.sin(this.mathBossTimer * spd) * 120 * dt * slowmo;
    this._bossY = 650 + Math.sin(this.mathBossTimer * spd * 0.7) * 50;
    // Rotation in phase 2+
    if (this._bossPhase >= 1) {
      this._bossRotation = Math.sin(this.mathBossTimer * spd * 1.3) * 0.25;
    } else { this._bossRotation *= 0.9; }

    // Afterimages
    if (this._bossPhase >= 2) {
      if (Math.random() < 0.3) {
        this._bossAfterimages.push({x:this._bossX, y:this._bossY, r:this._bossRotation, life:0.5});
      }
    }
    for (const ai of this._bossAfterimages) ai.life -= dt;
    this._bossAfterimages = this._bossAfterimages.filter(a => a.life > 0);

    // Ground rift attacks
    this._riftTimer -= dt;
    if (this._riftTimer <= 0) {
      this._riftTimer = 6.0 - this._bossPhase * 1.0;
      const rx = 200 + Math.random() * 1400;
      this._groundRifts.push({x: rx, w: 100 + Math.random() * 120, timer: 1.0, active: false});
    }
    for (const rift of this._groundRifts) {
      if (!rift.active) { rift.timer -= dt; if (rift.timer <= 0) rift.active = true; }
    }

    // Bullet patterns
    this._bossLastShot += dt;
    const shotInterval = [1.2, 0.8, 0.5, 0.35][this._bossPhase] / slowmo;
    if (this._bossLastShot > shotInterval && !this._bossCannonActive) {
      this._bossLastShot = 0;
      const pa = Math.atan2(p.y+22 - this._bossY, p.x+22 - this._bossX);
      if (this._bossInvuln) {
        // Bullet hell during invuln
        const count = Math.floor((8 + this._bossPhase * 4) * 0.7);
        for (let i = 0; i < count; i++) {
          const a = (Math.PI*2/count)*i + this.mathBossTimer*0.5;
          this.spawnBossBullet(a, 180+this._bossPhase*40, 'circle', '#f44', 5);
        }
      } else {
        // Normal fire
        this.spawnBossBullet(pa, 250, 'triangle', '#f44', 6);
        if (this._bossPhase >= 1) {
          this.spawnBossBullet(pa+0.25, 220, 'triangle', '#f84', 5);
          this.spawnBossBullet(pa-0.25, 220, 'triangle', '#f84', 5);
        }
        if (this._bossPhase >= 2) {
          this.spawnBossBullet(pa+0.5, 200, 'circle', '#f44', 5);
          this.spawnBossBullet(pa-0.5, 200, 'circle', '#f44', 5);
        }
        if (this._bossPhase >= 3) {
          for (let i = 0; i < 6; i++) {
            const ra = pa + (Math.random()-0.5)*1.5;
            this.spawnBossBullet(ra, 150+Math.random()*200, 'circle', '#f66', 4);
          }
        }
      }
    }

    // Cannon fire (bullets from player toward boss)
    if (this._bossCannonActive) {
      this._bossCannonTimer += dt;
      if (this._bossCannonTimer > 0.08) {
        this._bossCannonTimer = 0;
        const ca = Math.atan2(this._bossY - (p.y+22), this._bossX - (p.x+22));
        for (let i = 0; i < 5; i++) {
          const a = ca + (Math.random()-0.5)*0.25;
          const spd = 500 + Math.random()*300;
          this._bossBullets.push({
            x: p.x+22, y: p.y+22,
            vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
            type:'circle', color:'#0ff', size:4, life:3.0
          });
        }
        // Check if phase HP depleted
        const cp = Math.floor((12 - this.mathBossHP) / 3);
        if (cp !== this._bossCannonTargetPhase) {
          this._bossCannonActive = false;
          this.showMessage('阶段清空！曲率炮停止', 1500);
        }
      }
      // Drain boss HP gradually
      if (Math.random() < dt * 3 && !this._bossInvuln) {
        this.mathBossHP--;
        this.particles.emit(this._bossX, this._bossY, 5, '#0ff', 3, 0.3, 3);
        if (this.mathBossHP <= 0) {
          this.mathBossHP = 0;
          this.particles.emit(this._bossX, this._bossY, 80, '#ff0', 10, 3, 8);
          setTimeout(() => this.completeMathLevel(), 1500);
          return;
        }
      }
    }

    // Update bullets
    for (const bl of this._bossBullets) {
      bl.x += bl.vx * dt * (this._bossSlowmoTimer>0?0.35:1);
      bl.y += bl.vy * dt * (this._bossSlowmoTimer>0?0.35:1);
      bl.life -= dt;
      // Decoy attraction
      if (this._bossDecoyActive) {
        const da = Math.atan2(this._bossDecoyY - bl.y, this._bossDecoyX - bl.x);
        bl.vx += Math.cos(da)*60*dt; bl.vy += Math.sin(da)*60*dt;
      }
      // Player collision (skip if shielded)
      if (this._bossShieldTimer <= 0 && Math.abs(bl.x-p.x-22)<bl.size+10 && Math.abs(bl.y-p.y-22)<bl.size+10) {
        this.die(); return;
      }
    }
    this._bossBullets = this._bossBullets.filter(b => b.life > 0 && b.x > -50 && b.x < 2000 && b.y > -50 && b.y < 1100);

    // Powerup spawning
    this._powerupSpawnTimer -= dt;
    if (this._powerupSpawnTimer <= 0) this.spawnBossPowerup();

    // Powerup collection
    for (const pu of this._bossPowerups) {
      if (Math.abs(p.x+22-pu.x)<30 && Math.abs(p.y+22-pu.y)<30) {
        this.collectPowerup(pu);
        this._bossPowerups = this._bossPowerups.filter(x => x !== pu);
        break;
      }
    }
    this._bossPowerups = this._bossPowerups.filter(pu => { pu.life -= dt; return pu.life > 0; });

    // Player hits weak point (when vulnerable)
    if (!this._bossInvuln && this._bossWeakOpen) {
      if (Math.abs(p.x+22-this._bossX)<55 && Math.abs(p.y+22-(this._bossY-30))<40 && p.vy > 0) {
        this.mathBossHP--; this.audio.sfxBossHit();
        this._bossWeakOpen = false;
        this._bossFlashTimer = 0.3;
        this._bossInvuln = true;
        this._bossInvulnTimer = 3.0;
        this.audio.sfxOrb();
        this.particles.emit(this._bossX, this._bossY-30, 25, '#ff0', 6, 1, 5);
        if (this.mathBossHP <= 0) {
          this.audio.stopMusic();
          this._bossDead = true;
          this._bossDeadTimer = 0;
          this._bossDeadY = this._bossY;
          this._bossDeadRot = 0;
          this.mathBossHP = 0;
          this.particles.emit(this._bossX, this._bossY, 80, '#ff0', 10, 3, 8);
          this.audio.stopMusic();
        }
      }
    }
  }

  render(time) {
    const ctx = this.ctx;
    const scale = this.scale;
    const lv = this.getLevel();

    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

    if (this.state === 'cinematic') {
      this.drawCinematic(time, scale);
      this.drawScanlines(scale);
      this.drawVignette();
      return;
    }

    if (this.state === 'story') {
      this.drawStory(time, scale);
      this.drawScanlines(scale);
      this.drawVignette();
      return;
    }

    if (this.state === 'mathEntry') {
      this.drawMathEntry(scale);
      this.drawScanlines(scale);
      this.drawVignette();
      return;
    }

    if (this.state === 'mathPlaying') {
      this.drawMathPlaying(time, scale);
      this.drawScanlines(scale);
      this.drawVignette();
      return;
    }

    if (this.state === 'physicsEntry') {
      this.drawMathEntry(scale); this.drawScanlines(scale); this.drawVignette(); return;
    }
    if (this.state === 'physicsPlaying') {
      this.drawPhysicsPlaying(time, scale); this.drawScanlines(scale); this.drawVignette(); return;
    }
    if (this.state === 'chemEntry') {

    if (this.state === 'chemPlaying') {

    }
    if (this.state === 'tutorialIntro') {

      this.drawScanlines(scale);
      this.drawVignette();
      return;
    }

    if (this.state === 'finalBoss') {
      this.drawFinalBoss(time, scale); this.drawScanlines(scale); return;
    }
    if (this.state === 'title') {
      this.drawTitleScreen(time, scale);
      this.drawScanlines(scale);
      this.drawVignette();
      return;
    }

    // Background
    this.drawBackground(time, scale);

    // Platforms
    for (const plat of lv.platforms) {
      this.drawPlatform(plat, lv.accentColor, scale);
    }

    // Bridge segments
    this.drawBridgeSegments(time, scale);

    // Moving platforms
    this.drawMovingPlatforms(time, scale);

    // Hazards
    this.drawHazards(time, scale);

    // Switches
    this.drawSwitches(time, scale);

    // Doors
    this.drawDoors(time, scale);

    // Low passages
    this.drawLowPassages(time, scale);

    // Orbs
    this.drawOrbs(time, scale);

    // Crates
    this.drawCrates(time, scale);

    // Exit
    this.drawExit(time, scale);

    // Player
    this.drawPlayer(time, scale);

    // Particles
    this.particles.draw(ctx, scale);

    // Scan lines
    this.drawScanlines(scale);

    // Vignette
    this.drawVignette();

    // Level complete overlay
    if (this.state === 'complete') {
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
      const fontSize = Math.round(40 * scale);
      ctx.font = `900 ${fontSize}px Orbitron, monospace`;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#0ff';
      ctx.shadowColor = '#0ff';
      ctx.shadowBlur = 20 * scale;
      if (this.currentLevel < LEVELS.length - 1) {
        ctx.fillText(`第 ${this.currentLevel + 1} 关 通过！`, this.canvas.width / 2, this.canvas.height / 2);
        const subSize = Math.round(16 * scale);
        ctx.font = `${subSize}px Orbitron, monospace`;
        ctx.fillStyle = '#fff';
        ctx.fillText('正在进入下一关...', this.canvas.width / 2, this.canvas.height / 2 + 50 * scale);
      } else {
        ctx.fillText('全部通关！', this.canvas.width / 2, this.canvas.height / 2);
        const subSize = Math.round(16 * scale);
        ctx.font = `${subSize}px Orbitron, monospace`;
        ctx.fillStyle = '#fff';
        ctx.fillText(`总重置次数: ${this.deaths}`, this.canvas.width / 2, this.canvas.height / 2 + 50 * scale);
      }
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // Death overlay
    if (this.state === 'dead') {
      ctx.save();
      ctx.fillStyle = `rgba(255,0,0,${Math.max(0, 0.4 - this.stateTimer * 0.6)})`;
      ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
      ctx.restore();
    }
  }

  // ==================== GAME LOOP ====================
  loop(timestamp) {
    const rawDt = (timestamp - this.lastTime) / 1000;
    const dt = Math.min(rawDt, 0.05); // Cap to prevent physics explosions
    this.lastTime = timestamp;

    if (this.state === 'cinematic') {
      if (this.cinematicPhase === 0 && this.cinematicTimer === 0) this.initCinematic();
      this.updateCinematic(dt);
      this.time += dt;
    } else if (this.state === 'story') {
      if (!this._hudHidden) { this.hideHUD(); this._hudHidden = true; }
      this.updateStory(dt);
      this.time += dt;
    } else if (this.state === 'mathEntry') {
      this.updateMathEntry(dt);
      this.time += dt;
      if (this.mathEntryPhase >= 4) {
        this.state = 'mathPlaying';
        // HUD already set by loadMathLevel
      }
    } else if (this.state === 'mathPlaying') {
      this.updateMathPlaying(dt);
      this.time += dt;
    } else if (this.state === 'physicsEntry') {
      this.updateMathEntry(dt); this.time += dt;
      if (this.mathEntryPhase >= 4) {
        this.state = 'physicsPlaying';
        this.mathEntryPhase = -1;
        this._physLevelLocked = false;
        var plv = PHYSICS_LEVELS[this.physicsLevel];
        document.getElementById('lvl-num').textContent = '物理 '+(this.physicsLevel+1)+'/'+PHYSICS_LEVELS.length;
        document.getElementById('level-name').textContent = plv.name;
      }
    } else if (this.state === 'physicsPlaying') {
      this.updatePhysicsPlaying(dt); this.time += dt;
    } else if (this.state === 'chemEntry') {
      this.updateMathEntry(dt); this.time += dt;
      if (this.mathEntryPhase >= 4) {
        this.state = 'chemPlaying';
        var clv = CHEM_LEVELS[this.chemLevel];
        document.getElementById('lvl-num').textContent = '化学 1/1';
        document.getElementById('level-name').textContent = clv.name;
      }
    } else if (this.state === 'chemPlaying') {
      this.updateChemPlaying(dt); this.time += dt;
    } else if (this.state === 'tutorialIntro') {
      this.time += dt;
      if (this.tutorialButtonClicked) {
        this.tutorialFragmentTimer += dt;
        for (const f of this.tutorialFragments) {
          f.x += f.vx * dt;
          f.y += f.vy * dt;
          f.vy += 280 * dt;
          f.rotation += f.rv * dt;
          f.life -= dt;
        }
        this.tutorialFragments = this.tutorialFragments.filter(f => f.life > 0);
        if (this.tutorialFragmentTimer > 1.6) {
          this.startGame();
        }
      }
    } else if (this.state === 'playing') {
      this.time += dt;
      this.updatePhysics(dt);
      // particles disabled;
    } else if (this.state === 'complete') {
      this.stateTimer += dt;
      this.time += dt;
      // particles disabled;
      if (this.stateTimer > 2.0) {
        if (this.currentLevel < LEVELS.length - 1) {
          this.currentLevel++;
          this.loadLevel(this.currentLevel);
          this.state = 'playing';
        } else {
          this.state = 'story'; this.initStory();
        }
      }
    } else if (this.state === 'dead') {
      this.stateTimer -= dt;
      // particles disabled;
      this.time += dt;
      if (this.stateTimer <= 0) {
        this.loadLevel(this.currentLevel);
        this.state = 'playing';
      }
    } else if (this.state === 'finalBoss') {
      this.updateFinalBoss(dt); // particles disabled;  this.time += dt;
    } else if (this.state === 'win') {
      this.time += dt; // particles disabled;
    } else if (this.state === 'title') {
      this.time += dt;
    }

    this.render(this.time);
    requestAnimationFrame(t => this.loop(t));
  }
}

// ==================== START ====================
window.addEventListener('DOMContentLoaded', () => {
  new Game();
});
</script>
