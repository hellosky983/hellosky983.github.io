// ==================== AUDIO ENGINE ====================
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.musicNodes = [];
    this.musicGain = null;
    this.enabled = false;
    this.musicPlaying = false;
  }
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.value = 0.3;
    this.masterGain.connect(this.ctx.destination);
    this.enabled = true;
  }
  playTone(freq, duration, type='sine', vol=0.15, glide=0) {
    if (!this.enabled) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (glide) osc.frequency.linearRampToValueAtTime(freq + glide, t + duration);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start(t);
    osc.stop(t + duration);
  }
  playNoise(duration, vol=0.1, filterFreq=800) {
    if (!this.enabled) return;
    const t = this.ctx.currentTime;
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * duration, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = filterFreq;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(this.masterGain);
    src.start(t);
    src.stop(t + duration);
  }
  sfxJump() {
    this.playTone(250, 0.12, 'square', 0.08, 500);
    this.playTone(300, 0.08, 'sine', 0.05, 400);
  }
  sfxLand() {
    this.playNoise(0.06, 0.06, 300);
    this.playTone(80, 0.08, 'triangle', 0.1, -30);
  }
  sfxCrouch() {
    this.playTone(150, 0.15, 'sine', 0.05, -80);
  }
  sfxUncrouch() {
    this.playTone(200, 0.1, 'sine', 0.04, 100);
  }
  sfxLevelComplete() {
    const notes = [523, 659, 784, 1047];
    notes.forEach((f, i) => {
      setTimeout(() => this.playTone(f, 0.25, 'sine', 0.12, 0), i * 100);
      setTimeout(() => this.playTone(f * 1.5, 0.15, 'triangle', 0.05, 0), i * 100 + 30);
    });
  }
  sfxHint() {
    const harmonics = [880, 1320, 1760, 2200];
    harmonics.forEach((f, i) => {
      setTimeout(() => this.playTone(f, 0.6, 'sine', 0.04 / (i + 1), 0), i * 40);
    });
  }
  sfxDeath() {
    this.playTone(400, 0.3, 'sawtooth', 0.1, -300);
    this.playNoise(0.1, 0.05, 500);
  }
  sfxOrb() {
    this.playTone(1200, 0.2, 'sine', 0.1, 600);
    this.playTone(1800, 0.15, 'triangle', 0.05, 0);
  }
  sfxSwitch() {
    this.playTone(600, 0.05, 'square', 0.06, 0);
    this.playTone(800, 0.05, 'square', 0.05, 0);
  }
  sfxBossHit() {
    this.playTone(80, 0.15, 'sawtooth', 0.15, -40);
    this.playTone(40, 0.2, 'triangle', 0.2, -20);
    this.playNoise(0.08, 0.08, 200);
  }
  sfxCrate() {
    this.playNoise(0.08, 0.06, 200);
    this.playTone(60, 0.12, 'triangle', 0.08, 0);
  }
  startBossMusic() {
    if (!this.enabled) return;
    this.stopMusic();
    this.musicPlaying = true;
    var ctx = this.ctx;
    this.musicGain = ctx.createGain();
    this.musicGain.gain.value = 1.0;
    this.musicGain.connect(this.masterGain);
    // Heavy kick drum
    this._bossKick = ctx.createOscillator();
    this._bossKick.type = 'triangle'; this._bossKick.frequency.value = 40;
    var kickGain = ctx.createGain(); kickGain.gain.value = 0;
    this._bossKick.connect(kickGain); kickGain.connect(this.musicGain);
    this._bossKick.start(); this._bossKickGain = kickGain;
    // Deep bass drone
    var bass2 = ctx.createOscillator();
    bass2.type = 'sawtooth'; bass2.frequency.value = 50;
    var bassGain2 = ctx.createGain(); bassGain2.gain.value = 0.15;
    var bassFilt = ctx.createBiquadFilter();
    bassFilt.type = 'lowpass'; bassFilt.frequency.value = 250;
    bass2.connect(bassFilt); bassFilt.connect(bassGain2); bassGain2.connect(this.musicGain);
    bass2.start(); this.musicNodes.push(bass2,bassGain2,bassFilt);
    // Dissonant tension tone
    var high = ctx.createOscillator();
    high.type = 'sawtooth'; high.frequency.value = 220;
    var highGain = ctx.createGain(); highGain.gain.value = 0.04;
    var highFilt = ctx.createBiquadFilter();
    highFilt.type = 'bandpass'; highFilt.frequency.value = 800; highFilt.Q.value = 3;
    high.connect(highFilt); highFilt.connect(highGain); highGain.connect(this.musicGain);
    high.start(); this.musicNodes.push(high,highGain,highFilt);
    // Siren LFO
    var lfo2 = ctx.createOscillator();
    lfo2.frequency.value = 0.8;
    var lfo2Gain = ctx.createGain(); lfo2Gain.gain.value = 400;
    lfo2.connect(lfo2Gain); lfo2Gain.connect(high.frequency);
    lfo2.start(); this.musicNodes.push(lfo2,lfo2Gain);
    // Second tension layer (higher)
    var high2 = ctx.createOscillator();
    high2.type = 'square'; high2.frequency.value = 440;
    var high2Gain = ctx.createGain(); high2Gain.gain.value = 0.015;
    high2.connect(high2Gain); high2Gain.connect(this.musicGain);
    high2.start(); this.musicNodes.push(high2,high2Gain);
    // Slow LFO on second layer
    var lfo3 = ctx.createOscillator();
    lfo3.frequency.value = 0.3;
    var lfo3Gain = ctx.createGain(); lfo3Gain.gain.value = 100;
    lfo3.connect(lfo3Gain); lfo3Gain.connect(high2.frequency);
    lfo3.start(); this.musicNodes.push(lfo3,lfo3Gain);
    // Industrial noise layer
    var noiseBuf = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate);
    var nd = noiseBuf.getChannelData(0);
    for (var _ni=0;_ni<nd.length;_ni++) nd[_ni] = Math.random()*2-1;
    var noiseSrc = ctx.createBufferSource();
    noiseSrc.buffer = noiseBuf; noiseSrc.loop = true;
    var noiseFilt = ctx.createBiquadFilter();
    noiseFilt.type = 'bandpass'; noiseFilt.frequency.value = 600; noiseFilt.Q.value = 8;
    var noiseGain = ctx.createGain(); noiseGain.gain.value = 0.02;
    noiseSrc.connect(noiseFilt); noiseFilt.connect(noiseGain); noiseGain.connect(this.musicGain);
    noiseSrc.start(); this.musicNodes.push(noiseSrc,noiseFilt,noiseGain);
    // Kick pattern
    this._bossKickPattern = setInterval(function(){
      var t = ctx.currentTime;
      kickGain.gain.setValueAtTime(0.4, t);
      kickGain.gain.exponentialRampToValueAtTime(0.001, t+0.15);
    }, 250);
    this.musicNodes.push({stop:function(){}});
  }

  startMusic() {
    if (!this.enabled || this.musicPlaying) return;
    this.musicPlaying = true;
    const ctx = this.ctx;
    this.musicGain = ctx.createGain();
    this.musicGain.gain.value = 1.0;
    this.musicGain.connect(this.masterGain);

    // Bass drone
    const bass = ctx.createOscillator();
    bass.type = 'sawtooth';
    bass.frequency.value = 55;
    const bassGain = ctx.createGain();
    bassGain.gain.value = 0.15;
    const bassFilter = ctx.createBiquadFilter();
    bassFilter.type = 'lowpass';
    bassFilter.frequency.value = 200;
    bass.connect(bassFilter);
    bassFilter.connect(bassGain);
    bassGain.connect(this.musicGain);
    bass.start();
    this.musicNodes.push(bass, bassGain, bassFilter);

    // Pad
    const pad = ctx.createOscillator();
    pad.type = 'triangle';
    pad.frequency.value = 110;
    const padLfo = ctx.createOscillator();
    padLfo.frequency.value = 0.3;
    const padLfoGain = ctx.createGain();
    padLfoGain.gain.value = 8;
    padLfo.connect(padLfoGain);
    padLfoGain.connect(pad.frequency);
    padLfo.start();
    const padGain = ctx.createGain();
    padGain.gain.value = 0.08;
    pad.connect(padGain);
    padGain.connect(this.musicGain);
    this.musicNodes.push(pad, padLfo, padLfoGain, padGain);

    // High arp
    const arpNotes = [220, 330, 440, 330, 220, 277, 330, 440];
    let arpIdx = 0;
    const arp = ctx.createOscillator();
    arp.type = 'sine';
    arp.frequency.value = arpNotes[0];
    const arpGain = ctx.createGain();
    arpGain.gain.value = 0.04;
    arp.connect(arpGain);
    arpGain.connect(this.musicGain);
    arp.start();
    this.musicNodes.push(arp, arpGain);
    this._arpInterval = setInterval(() => {
      arpIdx = (arpIdx + 1) % arpNotes.length;
      arp.frequency.setTargetAtTime(arpNotes[arpIdx], ctx.currentTime, 0.1);
    }, 400);

    // Filter sweep
    const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const noiseSrc = ctx.createBufferSource();
    noiseSrc.buffer = noiseBuf;
    noiseSrc.loop = true;
    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.value = 1000;
    noiseFilter.Q.value = 5;
    const noiseLfo = ctx.createOscillator();
    noiseLfo.frequency.value = 0.15;
    const noiseLfoGain = ctx.createGain();
    noiseLfoGain.gain.value = 800;
    noiseLfo.connect(noiseLfoGain);
    noiseLfoGain.connect(noiseFilter.frequency);
    noiseLfo.start();
    const noiseGain = ctx.createGain();
    noiseGain.gain.value = 0.015;
    noiseSrc.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(this.musicGain);
    noiseSrc.start();
    this.musicNodes.push(noiseSrc, noiseFilter, noiseLfo, noiseLfoGain, noiseGain);
  }
  stopMusic() {
    this.musicPlaying = false;
    if (this._bossKickPattern) { clearInterval(this._bossKickPattern); this._bossKickPattern = null; }
    if (this._arpInterval) { clearInterval(this._arpInterval); this._arpInterval = null; }
    this.musicNodes.forEach(n => { try { n.stop(); } catch(e) {} });
    this.musicNodes = [];
    if (this.musicGain) { this.musicGain.disconnect(); this.musicGain = null; }
  }
}

// ==================== PARTICLE SYSTEM ====================
class Particle {
  constructor(x, y, vx, vy, life, color, size=2) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life; this.color = color; this.size = size;
  }
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.life -= dt;
  }
  get alpha() { return Math.max(0, this.life / this.maxLife); }
  get alive() { return this.life > 0; }
}

class ParticleSystem {
  constructor() { this.particles = []; }
  emit(x, y, count, color, speed=2, life=0.8, size=2) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd = Math.random() * speed;
      this.particles.push(new Particle(x, y, Math.cos(angle) * spd, Math.sin(angle) * spd - 2, life + Math.random() * 0.3, color, size));
    }
  }
  update(dt) {
    this.particles = this.particles.filter(p => { p.update(dt); return p.alive; });
  }
  draw(ctx, scale) {
    for (const p of this.particles) {
      ctx.save();
      ctx.globalAlpha = p.alpha * 0.7;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 6 * scale;
      ctx.fillRect(p.x - p.size * scale / 2, p.y - p.size * scale / 2, p.size * scale, p.size * scale);
      ctx.restore();
    }
  }
}

    this.loop(this.lastTime);
  }

  initCanvas() {
    const resize = () => {
      this.canvas.width = window.innerWidth;
      this.canvas.height = window.innerHeight;
      this.scale = Math.min(this.canvas.width / VW, this.canvas.height / VH);
    };
    resize();
    window.addEventListener('resize', resize);
    // Click to init audio
    this.canvas.addEventListener('click', (e) => {
      if (!this.audio.enabled) { this.audio.init(); this.audio.startMusic(); }
      if (this.state === 'story' && this.storyPhase === 0 && this.storyReady) {
        this.storyPhase = 1; this.storyTimer = 0; this.storyReady = false;
      }
      if (this.state === 'tutorialIntro' && !this.tutorialButtonClicked) {
        // Check if click is within button area
        const w = this.canvas.width, h = this.canvas.height;
        const bw = w * 0.46, bh = h * 0.18;
        const bx = (w - bw) / 2, by = h * 0.32;
        if (e.clientX >= bx && e.clientX <= bx + bw && e.clientY >= by && e.clientY <= by + bh) {
          this.spawnTutorialFragments();
        }
      }
    });
    document.addEventListener('keydown', () => {
      if (!this.audio.enabled) { this.audio.init(); this.audio.startMusic(); }
    }, {once: true});
  }

  setupInput() {
    this.keys = {};
    window.addEventListener('keydown', e => {
      this.keys[e.code] = true;
      if (e.code === 'Digit7') {
        // Skip to final boss
        this.mathDoorsDone = [true, true, true];
        this.physicsDoorsDone = [true, true, true];
        this.chemDoorsDone = [true, true, true];
        this.state = 'finalBoss'; this.storyPhase = 0; this._finalBossTimer = 0;
        this._finalBossHP = 500; this._finalBossPhase = 0; this._finalBossDead = false;
        this._finalBossX = 960; this._finalBossY = 500; this._finalBossVY = 100; this._finalBossDX = 80;
        this._finalBossBullets = []; this._finalBossMinions = [];
        this._finalBossPowerups = []; this._finalBossPowerTimer = 8;
        this._finalShieldTimer = 0; this._finalDmgTimer = 0; this._finalDmgCount = 0;
        this._finalBossDeathTimer = 0; this._finalGameOver = false; this._finalEndTimer = 0;
    this._finalLaserTimer = 0; this._finalLaserLast = 0; this._finalHomingTimer = 0;
    this._finalMiniBosses = []; this._finalMiniBossTimer = 0; this._finalAfterimages = [];
    this._finalBossPaused = false; this._finalPauseTimer = 0;
        this.player.x = 400; this.player.y = 806; this.player.vy = 0; this.player.onGround = true;
        this.hideHUD(); this.audio.stopMusic(); this.audio.startBossMusic();
        return;
      }
      if (e.code === 'KeyR') {
        if (this.state === 'finalBoss') {
          this.state = 'story'; this.storyPhase = 6; this.storyTimer = 0;
          this.storyInteriorPlayer = {x:960,y:826,vx:0,vy:0,onGround:true,facing:1,normalH:44,crouchH:22,h:44,crouching:false};
          this.showHUD();
          return;
        }
        if (this.mathActive) {
          this.loadMathLevel(); this.state = 'mathEntry'; this.startMathEntry();
        } else if (this.physicsActive) {
          this.loadPhysicsLevel(); this.state = 'physicsEntry'; this.startMathEntry();
        } else if (this.state === 'playing' || this.state === 'complete' || this.state === 'dead') {
          this.resetLevel();
        }
      }
      if (e.code === 'Space' || e.code === 'ArrowUp') e.preventDefault();
      if (e.code === 'ArrowDown') e.preventDefault();
      // Dev shortcut: press '4' to skip current major stage, or skip to boss in math
      if (e.code === 'Digit4') {
        if (this.mathActive) {
          this.mathLevel = MATH_LEVELS.length - 1;
          this.state = 'mathEntry'; this.startMathEntry(); this.loadMathLevel();
        } else if (this.physicsActive) {
          this.physicsLevel = PHYSICS_LEVELS.length - 1;
          this.state = 'physicsEntry'; this.startMathEntry(); this.loadPhysicsLevel();
        } else if (this.chemActive) {
          this.chemLevel = 0;
          this.state = 'chemEntry'; this.startMathEntry(); this.loadChemLevel();
        } else if (this.state === 'cinematic' || this.state === 'tutorialIntro') {
          if (this._skipHandler) { this.canvas.removeEventListener('click', this._skipHandler); this._skipHandler = null; }
          speechSynthesis.cancel();
          this.showHUD();
          this.state = 'playing'; this.deaths = 0; this.loadLevel(0);
        } else if (this.state === 'playing' || this.state === 'complete' || this.state === 'dead') {
          e.preventDefault();
          speechSynthesis.cancel();
          this.audio.stopMusic();
          this.keys = {};
          this.hideHUD();
          this.state = 'story';
          this.initStory();
          this.storyPhase = 6;
          this.storyTimer = 0;
          this.storyReady = false;
          this.storyHouseNarrationDone = true;
          this.narrationSpoken = [true, true];
          this.storyInteriorPlayer = { x: 160, y: 826, vx: 0, vy: 0, onGround: true, facing: 1, normalH: 44, crouchH: 22, h: 44, crouching: false };
          this.storyDustParticles = [];
        }
        return;
      }
      // Dev shortcut: press '5' for infinite shield in boss battle
      if (e.code === 'Digit5' && this.mathActive && this.state === 'mathPlaying') {
        const lv = MATH_LEVELS[this.mathLevel];
        if (lv.type === 'boss') {
          this._bossShieldTimer = 9999;
          this.showMessage('开发者护盾：无限无敌', 1500);
        }
      }
      if (e.code === 'Digit5' && this.physicsActive && this.state === 'physicsPlaying') {
        var plv = PHYSICS_LEVELS[this.physicsLevel];
        if (plv.type === 'boss') { this._physShieldTimer = 9999; this.showMessage('开发者护盾：无限无敌', 1500); }
      }
      if (e.code === 'Digit5' && this.chemActive && this.state === 'chemPlaying') {
        this._chemShieldTimer = 9999; this.showMessage('开发者护盾：无限无敌', 1500);
      }
      if (e.code === 'Digit5' && this.state === 'finalBoss') {
        this._finalShieldTimer = 9999; this.showMessage('开发者护盾：无限无敌', 1500);
      }
      if (e.code === 'Digit8' && this.state === 'finalBoss' && this._finalBossHP > 0) {
        var cp2 = Math.floor((500-this._finalBossHP)/100);
        this._finalBossHP = Math.max(0, 500 - (cp2+1)*100);
        this.showMessage('清空当前阶段! HP:'+this._finalBossHP, 1500);
        if (this._finalBossHP <= 0) { this._finalBossHP = 0; this._finalBossDead = true; this._finalBossDeathTimer = 0; this.audio.stopMusic(); this.audio.sfxLevelComplete(); }
      }
      if (e.code === 'Digit6' && this.mathActive && this.state === 'mathPlaying') {
        const lv = MATH_LEVELS[this.mathLevel];
        if (lv.type === 'boss' && this.mathBossHP > 0) {
          this.mathBossHP = 0; this.audio.stopMusic();
          this._bossDead = true;
          this._bossDeadTimer = 0; this._bossDeadY = this._bossY; this._bossDeadRot = 0;
          this._bossLanded = false;
          this.showMessage('开发者秒杀！', 1500);
        }
      }
      if (e.code === 'Digit6' && this.physicsActive && this.state === 'physicsPlaying') {
        const plv = PHYSICS_LEVELS[this.physicsLevel];
        if (plv.type === 'boss' && this._physicsBossHP > 0) {
          this._physicsBossHP = 0; this.audio.stopMusic();
          this._physicsBossDead = true;
          this._physicsBossTimer = 0;
          this.showMessage('开发者秒杀！', 1500);
        }
      }
      if (this.state === 'mathPlaying' && MATH_LEVELS[this.mathLevel]?.type==='dice' && !this.mathDiceRolling) { this.mathDiceRolling = true; }
      if (this.state === 'cinematic' && this.cinematicReady) this.advanceCinematic();
      if (this.state === 'story' && this.storyPhase === 0 && this.storyReady) { this.storyPhase = 1; this.storyTimer = 0; this.storyReady = false; }
      if (this.state === 'tutorialIntro' && e.code === 'Space' && !this.tutorialButtonClicked) this.spawnTutorialFragments();
      if (this.state === 'title' && e.code === 'Space') this.startGame();
      if (this.state === 'win' && e.code === 'Space') { this.currentLevel = 0; this.deaths = 0; this.loadLevel(0); this.state = 'playing'; }
    });
    window.addEventListener('keyup', e => { this.keys[e.code] = false; });
  }

  loadLevel(idx) {
    this.showHUD();
    this.currentLevel = idx;
    const lv = LEVELS[idx];
    this.player.x = lv.spawn.x;
    this.player.y = lv.spawn.y;
    this.player.vx = 0;
    this.player.vy = 0;
    this.player.h = this.player.normalH;
    this.player.targetH = this.player.normalH;
    this.player.crouching = false;
    this.player.onGround = false;
    this.player.trailPositions = [];
    this.hintFound = false;
    this.hintShowTimer = 0;
    this.camX = Math.max(0, this.player.x - VW / 2);
    this.camTargetX = this.camX;
    this.switchStates = (lv.switches || []).map(() => false);
    this.doorStates = (lv.doors || []).map(() => true);
    this.collectedOrbs = (lv.orbs || []).map(() => false);
    this.bridgeVisible = (lv.bridgeSegments || []).map(() => false);
    // Init crates
    this.crates = (lv.crates || []).map(c => ({...c, vx:0, vy:0, onGround:false}));
    // Init moving platforms
    this.movingPlatforms = (lv.movingPlatforms || []).map(mp => ({
      ...mp, currentY: mp.y, currentX: mp.x, baseX: mp.x, baseY: mp.y
    }));
    this.updateUI();
  }

  hideHUD() {
    document.getElementById('ui').style.display = 'none';
    document.getElementById('message').style.opacity = '0';
  }
  showHUD() {
    document.getElementById('ui').style.display = '';
  }

  updateUI() {
    const lv = LEVELS[this.currentLevel];
    document.getElementById('lvl-num').textContent = `第 ${this.currentLevel + 1} / ${LEVELS.length} 关`;
    document.getElementById('level-name').textContent = lv.name;
    document.getElementById('death-count').textContent = this.deaths > 0 ? `重置: ${this.deaths}` : '';
    // Progress dots
    const prog = document.getElementById('progress');
    prog.innerHTML = LEVELS.map((_, i) => {
      let cls = '';
      if (i < this.currentLevel) cls = 'done';
      else if (i === this.currentLevel) cls = 'current';
      return `<div class="progress-dot ${cls}"></div>`;
    }).join('');
    // Hint
    const hintEl = document.getElementById('hint-display');
    hintEl.textContent = `"${lv.hint}"`;
  }

  showMessage(text, duration=2000) {
    const el = document.getElementById('message');
    el.textContent = text;
    el.style.opacity = '1';
    clearTimeout(this._msgTimeout);
    this._msgTimeout = setTimeout(() => { el.style.opacity = '0'; }, duration);
  }

  resetLevel() {
    this.deaths++;
    this.audio.sfxDeath();
    this.loadLevel(this.currentLevel);
    this.state = 'playing';
  }

  startGame() {
    this.state = 'playing';
    this.deaths = 0;
    this._hudHidden = false;
    this.loadLevel(0);
  }

  die() {
    if (this.state !== 'playing' && this.state !== 'mathPlaying' && this.state !== 'physicsPlaying' && this.state !== 'finalBoss') return;
    if (this.mathActive) {
      this.audio.sfxDeath();
      this.particles.emit(this.player.x + this.player.w / 2, this.player.y + this.player.h / 2, 30, '#ff3333', 4, 0.6, 3);
      this.loadMathLevel(); this.state = 'mathEntry'; this.startMathEntry();
      return;
    }
    if (this.physicsActive) {
      this.audio.sfxDeath();
      this.particles.emit(this.player.x + this.player.w / 2, this.player.y + this.player.h / 2, 30, '#ff3333', 4, 0.6, 3);
      this.loadPhysicsLevel(); this.state = 'physicsEntry'; this.startMathEntry();
      return;
    }
    if (this.state === 'finalBoss' && !this._finalDying) {
      this.audio.sfxDeath();
      this._finalDying = true; this._finalDeathTimer = 1.5;
      this.particles.emit(this.player.x+22, this.player.y+22, 40, '#f00', 6, 1, 6);
      return;
    }
    this.state = 'dead';
    this.stateTimer = 0.6;
    this.audio.sfxDeath();
    this.particles.emit(this.player.x + this.player.w / 2, this.player.y + this.player.h / 2, 30, '#ff3333', 4, 0.6, 3);
    this.deaths++;
  }

  completeLevel() {
    if (this.state !== 'playing') return;
    this.state = 'complete';
    this.stateTimer = 0;
    this.audio.sfxLevelComplete();
    this.particles.emit(this.player.x + this.player.w / 2, this.player.y + this.player.h / 2, 50, '#00ffff', 5, 1.2, 4);
    this.particles.emit(this.player.x + this.player.w / 2, this.player.y + this.player.h / 2, 30, '#ff00ff', 4, 1.0, 3);
  }

  // ==================== PHYSICS ====================
  getLevel() { return LEVELS[this.currentLevel]; }

  getAllPlatforms() {
    const lv = this.getLevel();
    let plats = [...lv.platforms];
    // Include closed doors as solid platforms
    if (lv.doors) for (let di = 0; di < lv.doors.length; di++) {
      if (this.doorStates[di]) plats.push(lv.doors[di]);
    }
    // Add bridge segments if visible
    if (lv.bridgeSegments) {
      lv.bridgeSegments.forEach((seg, i) => {
        if (this.bridgeVisible[i]) plats.push(seg);
      });
    }
    // Add moving platforms at current positions
    this.movingPlatforms.forEach(mp => {
      plats.push({x: mp.currentX, y: mp.currentY, w: mp.w, h: mp.h});
    });
    return plats;
  }

  rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  resolvePlayerCollision(plat) {
    const p = this.player;
    const overlapX = Math.min(p.x + p.w, plat.x + plat.w) - Math.max(p.x, plat.x);
    const overlapY = Math.min(p.y + p.h, plat.y + plat.h) - Math.max(p.y, plat.y);
    if (overlapX <= 0 || overlapY <= 0) return;

    // Determine collision direction based on smallest overlap
    const fromLeft = plat.x - (p.x + p.w) + overlapX;
    const fromRight = (plat.x + plat.w) - p.x + overlapX;
    const fromTop = plat.y - (p.y + p.h) + overlapY;
    const fromBottom = (plat.y + plat.h) - p.y + overlapY;

    const minX = Math.min(Math.abs(p.vx > 0 ? fromLeft : fromRight), overlapX);
    const minY = Math.min(Math.abs(p.vy > 0 ? fromTop : fromBottom), overlapY);

    if (minX < minY) {
      // Horizontal collision
      if (p.vx > 0) p.x = plat.x - p.w;
      else if (p.vx < 0) p.x = plat.x + plat.w;
      p.vx = 0;
    } else {
      // Vertical collision
      if (p.vy > 0) {
        p.y = plat.y - p.h;
        p.vy = 0;
        if (!p.onGround) { p.onGround = true; p.jumpsLeft = (this.physicsActive ? 4 : (this.mathActive ? 2 : 1)); this.audio.sfxLand(); }
      } else if (p.vy < 0) {
        p.y = plat.y + plat.h;
        p.vy = 0;
      }
    }
  }

  updatePhysics(dt) {
    const p = this.player;
    const GRAVITY = 1400;
    const MOVE_SPEED = 420;
    const CROUCH_SPEED = 200;
    const JUMP_VEL = -620;
    const FRICTION = 0.82;
    const MAX_VX = 600;

    // Update moving platforms first (before player physics)
    for (const mp of this.movingPlatforms) {
      mp.lastY = mp.currentY;
      mp.lastX = mp.currentX;
      const phase = (this.time * 2 * Math.PI) / mp.period + mp.phase;
      const offset = Math.sin(phase) * mp.amplitude;
      if (mp.axis === 'y') { mp.currentY = mp.baseY + offset; mp.currentX = mp.baseX; }
      else { mp.currentX = mp.baseX + offset; mp.currentY = mp.baseY; }
    }
    // If player was on a moving platform, move with it
    for (const mp of this.movingPlatforms) {
      const wasOn = p.onGround && p.x + p.w > mp.lastX && p.x < mp.lastX + mp.w &&
        Math.abs((p.y + p.h) - mp.lastY) < 6;
      if (wasOn) { p.y += mp.currentY - mp.lastY; p.x += mp.currentX - mp.lastX; }
    }

    // Input
    const moveLeft = this.keys['ArrowLeft'] || this.keys['KeyA'];
    const moveRight = this.keys['ArrowRight'] || this.keys['KeyD'];
    const jumpPressed = this.keys['Space'] || this.keys['ArrowUp'] || this.keys['KeyW'];
    const crouchPressed = this.keys['ArrowDown'] || this.keys['KeyS'];

    // Crouch
    p.crouching = crouchPressed && p.onGround;
    const wasCrouching = p.targetH < p.normalH - 1;
    p.targetH = p.crouching ? p.crouchH : p.normalH;

    // Animate crouch transition
    const crouchSpeed = 400;
    if (Math.abs(p.h - p.targetH) > 1) {
      const dir = p.targetH > p.h ? 1 : -1;
      p.h += dir * crouchSpeed * dt;
      if (dir > 0) p.y -= crouchSpeed * dt;
      if (dir < 0) p.y += crouchSpeed * dt; // keep feet planted when crouching
      // When growing taller, check ceiling (blocked by low passage)
      if (dir > 0) {
        let blocked = false;
        for (const plat of this.getAllPlatforms()) {
          if (this.rectsOverlap({x:p.x, y:p.y - (p.targetH - p.h), w:p.w, h:p.targetH}, plat)) {
            blocked = true;
            break;
          }
        }
        if (blocked) {
          p.h -= crouchSpeed * dt;
          p.y += crouchSpeed * dt;
          if (p.h < p.crouchH) p.h = p.crouchH;
        }
      }
    }
    if (Math.abs(p.h - p.targetH) <= 2) {
      if (p.targetH < p.normalH - 1 && p.h > p.targetH) {
        p.y += p.h - p.targetH;
        p.h = p.targetH;
      } else if (p.targetH >= p.normalH - 1) {
        p.h = p.normalH;
      }
    }

    // Sound on crouch/uncrouch
    if (p.crouching && !wasCrouching) this.audio.sfxCrouch();
    if (!p.crouching && wasCrouching && p.h >= p.normalH - 2) this.audio.sfxUncrouch();

    // Horizontal movement
    const speed = p.crouching ? CROUCH_SPEED : MOVE_SPEED;
    if (moveLeft) { p.vx -= speed * dt * 3; p.facing = -1; }
    if (moveRight) { p.vx += speed * dt * 3; p.facing = 1; }
    if (!moveLeft && !moveRight) p.vx *= FRICTION;

    // Clamp
    p.vx = Math.max(-MAX_VX, Math.min(MAX_VX, p.vx));
    if (Math.abs(p.vx) < 5) p.vx = 0;

    // Jump (with double jump in math levels)
    if (jumpPressed) {
      if (p.onGround) {
        p.vy = JUMP_VEL;
        p.onGround = false;
        p.jumpsLeft = (this.physicsActive ? 4 : (this.mathActive ? 2 : 1));
        p.squashStretch = -0.4;
        this.audio.sfxJump();
        this.particles.emit(p.x + p.w / 2, p.y + p.h, 8, '#00ffff', 2, 0.3, 2);
      } else if ((this.mathActive||this.physicsActive) && p.jumpsLeft > 1 && !this._jumpWasPressed) {
        p.vy = JUMP_VEL * 0.85;
        p.jumpsLeft--;
        p.squashStretch = -0.3;
        this.audio.sfxJump();
        this.particles.emit(p.x + p.w / 2, p.y + p.h, 6, '#ff88ff', 2, 0.3, 2);
      }
    }
    this._jumpWasPressed = jumpPressed;

    // Gravity
    p.vy += GRAVITY * dt;
    if (!p.onGround) p.vy = Math.min(p.vy, 900);

    // Move
    p.x += p.vx * dt;
    p.y += p.vy * dt;

    // Check if still on ground
    var wasOnGround = p.onGround;
    p.onGround = false;
    for (const plat of this.getAllPlatforms()) {
      // Standing on top
      if (p.x + p.w > plat.x && p.x < plat.x + plat.w &&
          Math.abs((p.y + p.h) - plat.y) < 3 && p.vy >= 0) {
        p.y = plat.y - p.h;
        p.vy = 0;
        p.onGround = true;
      }
    }
    // Reset jumps on landing
    if (!wasOnGround && p.onGround) {
      p.jumpsLeft = (this.physicsActive ? 4 : (this.mathActive ? 2 : 1));
      this.audio.sfxLand();
    }

    // Collision resolution
    for (const plat of this.getAllPlatforms()) {
      if (this.rectsOverlap(p, plat)) {
        this.resolvePlayerCollision(plat);
      }
    }

    // Bounds
    const lv = this.getLevel();
    if (p.x < 0) { p.x = 0; p.vx = 0; }
    if (p.x + p.w > lv.width) { p.x = lv.width - p.w; }
    if (p.y > VH + 50) this.die();
    if (p.y < -200) { p.y = -200; p.vy = 0; }

    // Squash/stretch animation
    if (p.onGround) {
      p.squashStretch += (0 - p.squashStretch) * 10 * dt;
    } else {
      p.squashStretch += (0.15 - p.squashStretch) * 5 * dt;
    }

    // Trail
    if (Math.abs(p.vx) > 50 || !p.onGround) {
      p.trailPositions.push({x: p.x + p.w/2, y: p.y + p.h/2, life: 0.2, vx: p.vx, h: p.h});
    }
    p.trailPositions = p.trailPositions.filter(t => { t.life -= dt; return t.life > 0; });

    // Animation timer
    p.animTimer += dt;

    // Update crates
    for (const crate of this.crates) {
      crate.vy += GRAVITY * dt;
      crate.x += crate.vx * dt;
      crate.y += crate.vy * dt;
      crate.onGround = false;

      for (const plat of this.getAllPlatforms()) {
        if (this.rectsOverlap(crate, plat)) {
          // Simple collision resolution for crates
          const c = crate;
          const ovX = Math.min(c.x + c.w, plat.x + plat.w) - Math.max(c.x, plat.x);
          const ovY = Math.min(c.y + c.h, plat.y + plat.h) - Math.max(c.y, plat.y);
          if (ovY < ovX) {
            if (c.vy > 0) { c.y = plat.y - c.h; c.vy = 0; c.onGround = true; }
            else if (c.vy < 0) { c.y = plat.y + plat.h; c.vy = 0; }
          } else {
            if (c.vx > 0) c.x = plat.x - c.w;
            else if (c.vx < 0) c.x = plat.x + plat.w;
            c.vx = 0;
          }
        }
      }

      // Crate-player collision
      if (this.rectsOverlap(p, crate)) {
        const absVx = Math.abs(p.vx);
        const requiredSpeed = crate.mass * 55;
        if (absVx > requiredSpeed) {
          crate.vx = Math.sign(p.vx) * absVx * 0.75;
          crate.vy = -80;
          this.audio.sfxCrate();
          this.particles.emit(crate.x + crate.w/2, crate.y + crate.h/2, 8, '#ffaa00', 3, 0.4, 3);
        }
        // Push player out
        if (p.vx > 0) p.x = crate.x - p.w;
        else if (p.vx < 0) p.x = crate.x + crate.w;
        p.vx = 0;
      }

      // Crate falls off
      if (crate.y > VH + 100) {
        crate.x = this.getLevel().crates.find(c => c === crate)?.x ?? crate.x;
        crate.y = -100;
        crate.vx = 0;
        crate.vy = 0;
      }

      // Friction
      if (crate.onGround) crate.vx *= 0.985;
    }


    // Check switches
    const switches = this.getLevel().switches || [];
    for (let i = 0; i < switches.length; i++) {
      const sw = switches[i];
      const swRect = {x: sw.x, y: sw.y, w: sw.w, h: sw.h};
      const playerOnSwitch = this.rectsOverlap(p, swRect) && p.onGround;
      const crouchOk = !sw.crouchRequired || p.crouching;
      // Also check if a crate is on the switch
      let crateOnSwitch = false;
      for (const crate of this.crates) {
        if (this.rectsOverlap(crate, swRect) && crate.onGround) crateOnSwitch = true;
      }
      const activated = (playerOnSwitch && crouchOk) || crateOnSwitch;
      if (activated !== this.switchStates[i]) {
        this.switchStates[i] = activated;
        const doorIdx = sw.linkedDoor;
        if (doorIdx !== undefined) this.doorStates[doorIdx] = !activated;
        if (activated) this.audio.sfxSwitch();
      }
    }

    // Check orbs
    const orbs = this.getLevel().orbs || [];
    for (let i = 0; i < orbs.length; i++) {
      if (this.collectedOrbs[i]) continue;
      const orb = orbs[i];
      const orbRect = {x: orb.x - 15, y: orb.y - 15, w: 30, h: 30};
      if (this.rectsOverlap(p, orbRect)) {
        this.collectedOrbs[i] = true;
        this.audio.sfxOrb();
        this.particles.emit(orb.x, orb.y, 20, '#ffff00', 4, 0.8, 3);
        // Reveal bridge segment
        if (this.getLevel().bridgeSegments && i < this.bridgeVisible.length) {
          this.bridgeVisible[i] = true;
          this.particles.emit(
            this.getLevel().bridgeSegments[i].x + 50,
            this.getLevel().bridgeSegments[i].y, 15, '#00ff88', 3, 0.5, 3
          );
        }
      }
    }

    // Check hint discovery
    if (!this.hintFound) {
      const hintX = lv.width / 2;
      const dist = Math.abs(p.x - hintX);
      if (dist < 300) {
        this.hintFound = true;
        this.audio.sfxHint();
        this.showMessage('💡 发现关键提示！', 2500);
        document.getElementById('hint-display').style.opacity = '1';
        this.hintShowTimer = 6;
      }
    }
    if (this.hintShowTimer > 0) {
      this.hintShowTimer -= dt;
      if (this.hintShowTimer <= 0) {
        document.getElementById('hint-display').style.opacity = '0';
      }
    }

    // Check exit
    const exit = lv.exit;
    const exitRect = {x: exit.x, y: exit.y, w: exit.w || 50, h: exit.h || 50};
    if (this.rectsOverlap(p, exitRect)) {
      this.completeLevel();
    }

    // Check hazards
    const hazards = lv.hazards || [];
    for (const h of hazards) {
      if (this.rectsOverlap(p, h)) this.die();
    }

    // Check low passages (indicate crouch needed)
    // (visual only - collision handles actual blocking)

    // Camera
    this.camTargetX = p.x - VW / 2 + p.w / 2;
    this.camTargetX = Math.max(0, Math.min(this.camTargetX, lv.width - VW));
    this.camX += (this.camTargetX - this.camX) * 8 * dt;
  }

  // ==================== RENDER ====================
  drawBackground(time, scale) {
    const ctx = this.ctx;
    const w = this.canvas.width, h = this.canvas.height;
    const lv = this.getLevel();

    // Gradient background
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#020210');
    grad.addColorStop(0.5, lv.bgColor);
    grad.addColorStop(1, '#020210');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // Grid
    ctx.save();
    ctx.strokeStyle = lv.accentColor;
    ctx.globalAlpha = 0.06;
    ctx.lineWidth = 1;
    const gridSize = 50 * scale;
    const startX = -(this.camX * scale) % gridSize;
    const startY = -(time * 30 * scale) % gridSize;
    for (let x = startX; x < w; x += gridSize) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
      ctx.stroke();
    }
    for (let y = startY; y < h; y += gridSize) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    }
    ctx.restore();

    // Hint text in background
    ctx.save();
    ctx.globalAlpha = 0.08 + Math.sin(time * 0.8) * 0.03;
    ctx.fillStyle = lv.accentColor;
    const hintFontSize = Math.round(80 * scale);
    ctx.font = `900 ${hintFontSize}px Orbitron, monospace`;
    ctx.textAlign = 'center';
    const hintScreenX = (lv.width / 2 - this.camX) * scale;
    ctx.fillText(lv.hint, hintScreenX, h * 0.4);
    // Detail text
    ctx.globalAlpha = 0.04 + Math.sin(time * 0.6 + 1) * 0.02;
    const detailFontSize = Math.round(24 * scale);
    ctx.font = `${detailFontSize}px Orbitron, monospace`;
    ctx.fillText(lv.hintDetail, hintScreenX, h * 0.4 + 50 * scale);
    ctx.restore();

    // Stars / ambient particles
    ctx.save();
    for (let i = 0; i < 60; i++) {
      const sx = ((i * 137.5 + time * 15 * (i % 3 + 1)) % w + w) % w;
      const sy = ((i * 251.7 + Math.sin(time + i) * 40) % h + h) % h;
      ctx.globalAlpha = 0.2 + Math.sin(time * 2 + i) * 0.15;
      ctx.fillStyle = i % 3 === 0 ? '#0ff' : (i % 3 === 1 ? '#f0f' : '#fff');
      const starSize = (1 + (i % 3)) * scale;
      ctx.fillRect(sx, sy, starSize, starSize);
    }
    ctx.restore();
  }

  drawPlatform(plat, accentColor, scale, alpha=1) {
    const ctx = this.ctx;
    const sx = (plat.x - this.camX) * scale;
    const sy = plat.y * scale;
    const sw = plat.w * scale;
    const sh = plat.h * scale;

    // Main body
    const grad = ctx.createLinearGradient(sx, sy, sx, sy + sh);
    grad.addColorStop(0, 'rgba(20,25,40,0.9)');
    grad.addColorStop(0.5, 'rgba(30,35,55,0.95)');
    grad.addColorStop(1, 'rgba(10,12,25,0.9)');
    ctx.fillStyle = grad;
    ctx.globalAlpha = alpha;
    ctx.fillRect(sx, sy, sw, sh);

    // Top edge glow
    ctx.strokeStyle = accentColor;
    ctx.globalAlpha = 0.6 * alpha;
    ctx.lineWidth = 1.5 * scale;
    ctx.shadowColor = accentColor;
    ctx.shadowBlur = 8 * scale;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + sw, sy);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Subtle side lines
    ctx.globalAlpha = 0.15 * alpha;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx, sy + sh);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(sx + sw, sy);
    ctx.lineTo(sx + sw, sy + sh);
    ctx.stroke();

    ctx.globalAlpha = 1;
  }

  drawPlayer(time, scale) {
    const ctx = this.ctx;
    const p = this.player;
    const cx = (p.x + p.w / 2 - this.camX) * scale;
    const baseY = (p.y + p.h) * scale;
    const ss = p.squashStretch; // -0.4 to 0.15

    // Trail
    for (const t of p.trailPositions) {
      const alpha = t.life / 0.2 * 0.3;
      const size = (p.w * scale) * (0.5 + t.life / 0.2 * 0.5);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#0ff';
      ctx.shadowColor = '#0ff';
      ctx.shadowBlur = 10 * scale;
      const tx = (t.x - this.camX) * scale;
      const ty = t.y * scale;
      ctx.fillRect(tx - size / 2, ty - size / 2, size, size * (t.h / p.normalH));
      ctx.restore();
    }

    // Main body with squash/stretch
    const w = p.w * scale * (1 + ss * 0.3);
    const h = p.h * scale * (1 - ss * 0.5);
    const x = cx - w / 2;
    const y = baseY - h;

    // Outer glow
    ctx.save();
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 18 * scale;
    ctx.fillStyle = 'rgba(0,255,255,0.15)';
    ctx.fillRect(x - 4 * scale, y - 4 * scale, w + 8 * scale, h + 8 * scale);
    ctx.restore();

    // Core body
    const bodyGrad = ctx.createLinearGradient(x, y, x, y + h);
    bodyGrad.addColorStop(0, '#0cf');
    bodyGrad.addColorStop(0.3, '#09f');
    bodyGrad.addColorStop(0.7, '#047');
    bodyGrad.addColorStop(1, '#025');
    ctx.fillStyle = bodyGrad;
    ctx.fillRect(x, y, w, h);

    // Border
    ctx.strokeStyle = '#0ff';
    ctx.lineWidth = 2 * scale;
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 8 * scale;
    ctx.strokeRect(x, y, w, h);
    ctx.shadowBlur = 0;

    // Inner highlights
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(x + 2 * scale, y + 2 * scale, w * 0.3, h * 0.3);
    ctx.fillStyle = 'rgba(0,255,255,0.2)';
    ctx.fillRect(x + w * 0.6, y + h * 0.6, w * 0.3, h * 0.3);

    // Crouch indicator
    if (p.crouching) {
      ctx.strokeStyle = '#ff0';
      ctx.lineWidth = 2 * scale;
      ctx.shadowColor = '#ff0';
      ctx.shadowBlur = 5 * scale;
      ctx.setLineDash([4 * scale, 4 * scale]);
      ctx.strokeRect(x - 2 * scale, y - 2 * scale, w + 4 * scale, h + 4 * scale);
      ctx.setLineDash([]);
      ctx.shadowBlur = 0;
    }

    // Eye/face indicator
    const eyeSize = 4 * scale;
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 4 * scale;
    const eyeX = cx + p.facing * w * 0.2;
    ctx.fillRect(eyeX - eyeSize, y + h * 0.3 - eyeSize / 2, eyeSize * 2, eyeSize);
    ctx.shadowBlur = 0;
  }

  drawHazards(time, scale) {
    const ctx = this.ctx;
    const hazards = this.getLevel().hazards || [];
    for (const h of hazards) {
      const sx = (h.x - this.camX) * scale;
      const sy = h.y * scale;
      const sw = h.w * scale;
      const sh = h.h * scale;

      // Red glow
      ctx.fillStyle = 'rgba(255,0,0,0.3)';
      ctx.shadowColor = '#f00';
      ctx.shadowBlur = 15 * scale;

      // Draw spikes
      const spikeCount = Math.floor(sw / (12 * scale));
      const spikeW = sw / spikeCount;
      ctx.fillStyle = '#c00';
      for (let i = 0; i < spikeCount; i++) {
        ctx.beginPath();
        const sx2 = sx + i * spikeW;
        ctx.moveTo(sx2, sy + sh);
        ctx.lineTo(sx2 + spikeW / 2, sy);
        ctx.lineTo(sx2 + spikeW, sy + sh);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 0.6 + Math.sin(time * 6) * 0.2;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  drawExit(time, scale) {
    const ctx = this.ctx;
    const exit = this.getLevel().exit;
    const sx = (exit.x - this.camX) * scale;
    const sy = exit.y * scale;
    const sw = (exit.w || 50) * scale;
    const sh = (exit.h || 50) * scale;

    // Pulsing glow
    const pulse = 0.6 + Math.sin(time * 3) * 0.3;
    ctx.save();
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 25 * scale * pulse;

    // Outer ring
    ctx.strokeStyle = '#0ff';
    ctx.lineWidth = 3 * scale;
    ctx.globalAlpha = pulse;
    ctx.beginPath();
    ctx.arc(sx + sw / 2, sy + sh / 2, sw * 0.8, 0, Math.PI * 2);
    ctx.stroke();

    // Inner ring
    ctx.strokeStyle = '#f0f';
    ctx.globalAlpha = 0.7;
    ctx.lineWidth = 2 * scale;
    ctx.beginPath();
    ctx.arc(sx + sw / 2, sy + sh / 2, sw * 0.5, 0, Math.PI * 2);
    ctx.stroke();

    // Center
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = pulse;
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 10 * scale;
    ctx.beginPath();
    ctx.arc(sx + sw / 2, sy + sh / 2, sw * 0.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  drawOrbs(time, scale) {
    const ctx = this.ctx;
    const orbs = this.getLevel().orbs || [];
    for (let i = 0; i < orbs.length; i++) {
      if (this.collectedOrbs[i]) continue;
      const orb = orbs[i];
      const ox = (orb.x - this.camX) * scale;
      const oy = orb.y * scale;
      const r = 12 * scale;
      const bob = Math.sin(time * 4 + i) * 4 * scale;

      ctx.save();
      ctx.shadowColor = '#ff0';
      ctx.shadowBlur = 15 * scale;

      // Glow
      const glowGrad = ctx.createRadialGradient(ox, oy + bob, 0, ox, oy + bob, r * 2);
      glowGrad.addColorStop(0, 'rgba(255,255,0,0.4)');
      glowGrad.addColorStop(1, 'rgba(255,255,0,0)');
      ctx.fillStyle = glowGrad;
      ctx.fillRect(ox - r * 2, oy + bob - r * 2, r * 4, r * 4);

      // Core
      ctx.fillStyle = '#ff0';
      ctx.beginPath();
      ctx.arc(ox, oy + bob, r, 0, Math.PI * 2);
      ctx.fill();

      // E label
      ctx.fillStyle = '#000';
      ctx.font = `bold ${Math.round(10*scale)}px Orbitron, monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('E', ox, oy + bob);
      ctx.textBaseline = 'alphabetic';

      ctx.restore();
    }
  }

  drawCrates(time, scale) {
    const ctx = this.ctx;
    for (const crate of this.crates) {
      const sx = (crate.x - this.camX) * scale;
      const sy = crate.y * scale;
      const sw = crate.w * scale;
      const sh = crate.h * scale;

      ctx.fillStyle = '#844';
      ctx.strokeStyle = '#f84';
      ctx.lineWidth = 2 * scale;
      ctx.shadowColor = '#f84';
      ctx.shadowBlur = 6 * scale;
      ctx.fillRect(sx, sy, sw, sh);
      ctx.strokeRect(sx, sy, sw, sh);

      // Mass label
      const fontSize = Math.round(10 * scale);
      ctx.fillStyle = '#fff';
      ctx.font = `${fontSize}px Orbitron, monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(`m=${crate.mass}`, sx + sw / 2, sy + sh / 2 + fontSize * 0.3);
      ctx.textAlign = 'start';
      ctx.shadowBlur = 0;
    }
  }

  drawSwitches(time, scale) {
    const ctx = this.ctx;
    const switches = this.getLevel().switches || [];
    for (let i = 0; i < switches.length; i++) {
      const sw = switches[i];
      const sx = (sw.x - this.camX) * scale;
      const sy = sw.y * scale;
      const swW = sw.w * scale;
      const swH = sw.h * scale;
      const active = this.switchStates[i];

      ctx.fillStyle = active ? '#0f0' : '#333';
      ctx.strokeStyle = active ? '#0f0' : '#555';
      ctx.lineWidth = 2 * scale;
      ctx.shadowColor = active ? '#0f0' : '#555';
      ctx.shadowBlur = (active ? 12 : 4) * scale;
      ctx.fillRect(sx, sy, swW, swH);
      ctx.strokeRect(sx, sy, swW, swH);

      // Label
      const fontSize = Math.round(9 * scale);
      ctx.fillStyle = '#fff';
      ctx.font = `${fontSize}px Orbitron, monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(sw.crouchRequired ? 'P=F/A' : 'SW', sx + swW / 2, sy - 8 * scale);
      ctx.textAlign = 'start';
      ctx.shadowBlur = 0;
    }
  }

  drawDoors(time, scale) {
    const ctx = this.ctx;
    const doors = this.getLevel().doors || [];
    for (let i = 0; i < doors.length; i++) {
      if (!this.doorStates[i]) continue; // Door open (invisible)
      const d = doors[i];
      const sx = (d.x - this.camX) * scale;
      const sy = d.y * scale;
      const sw = d.w * scale;
      const sh = d.h * scale;

      ctx.fillStyle = 'rgba(255,60,60,0.8)';
      ctx.strokeStyle = '#f44';
      ctx.lineWidth = 3 * scale;
      ctx.shadowColor = '#f44';
      ctx.shadowBlur = 10 * scale;
      ctx.fillRect(sx, sy, sw, sh);
      ctx.strokeRect(sx, sy, sw, sh);

      // Locked icon
      ctx.fillStyle = '#fff';
      const fontSize = Math.round(10 * scale);
      ctx.font = `${fontSize}px Orbitron, monospace`;
      ctx.textAlign = 'center';
      ctx.fillText('🔒', sx + sw / 2, sy + sh / 2 + fontSize * 0.3);
      ctx.textAlign = 'start';
      ctx.shadowBlur = 0;
    }
  }

  drawMovingPlatforms(time, scale) {
    for (const mp of this.movingPlatforms) {
      const accentColor = this.getLevel().accentColor;
      this.drawPlatform(
        {x: mp.currentX, y: mp.currentY, w: mp.w, h: mp.h},
        accentColor, scale, 0.85
      );
      // Trajectory line
      const ctx = this.ctx;
      ctx.save();
      ctx.globalAlpha = 0.1;
      ctx.strokeStyle = accentColor;
      ctx.lineWidth = 1;
      ctx.setLineDash([5 * scale, 10 * scale]);
      const trajX = (mp.baseX + mp.w / 2 - this.camX) * scale;
      ctx.beginPath();
      ctx.moveTo(trajX, (mp.baseY - mp.amplitude) * scale);
      ctx.lineTo(trajX, (mp.baseY + mp.amplitude) * scale);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
  }

  drawBridgeSegments(time, scale) {
    const segs = this.getLevel().bridgeSegments || [];
    const ctx = this.ctx;
    for (let i = 0; i < segs.length; i++) {
      if (!this.bridgeVisible[i]) continue;
      const seg = segs[i];
      const sx = (seg.x - this.camX) * scale;
      const sy = seg.y * scale;
      const sw = seg.w * scale;
      const sh = seg.h * scale;

      // Glowing bridge
      ctx.fillStyle = 'rgba(0,255,136,0.7)';
      ctx.shadowColor = '#0f8';
      ctx.shadowBlur = 15 * scale;
      ctx.fillRect(sx, sy, sw, sh);
      ctx.strokeStyle = '#0f8';
      ctx.lineWidth = 2 * scale;
      ctx.strokeRect(sx, sy, sw, sh);

      // Energy lines
      ctx.strokeStyle = '#fff';
      ctx.globalAlpha = 0.3 + Math.sin(time * 8 + i) * 0.2;
      ctx.lineWidth = 1;
      for (let lx = sx; lx < sx + sw; lx += 8 * scale) {
        ctx.beginPath();
        ctx.moveTo(lx, sy);
        ctx.lineTo(lx, sy + sh);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }
  }

  drawLowPassages(time, scale) {
    const ctx = this.ctx;
    const passages = this.getLevel().lowPassages || [];
    for (const lp of passages) {
      const sx = (lp.x - this.camX) * scale;
      const sy = lp.y * scale;
      const sw = lp.w * scale;
      const sh = lp.h * scale;

      // Ceiling obstacle indicator
      ctx.fillStyle = 'rgba(255,255,0,0.15)';
      ctx.strokeStyle = '#ff0';
      ctx.lineWidth = 2 * scale;
      ctx.setLineDash([8 * scale, 4 * scale]);
      ctx.strokeRect(sx, sy, sw, sh);

      // Down arrow
      const arrowY = sy + sh + 15 * scale;
      ctx.fillStyle = '#ff0';
      ctx.globalAlpha = 0.5 + Math.sin(time * 3) * 0.3;
      const arrowSize = 10 * scale;
      ctx.beginPath();
      ctx.moveTo(sx + sw / 2, arrowY + arrowSize);
      ctx.lineTo(sx + sw / 2 - arrowSize, arrowY);
      ctx.lineTo(sx + sw / 2 + arrowSize, arrowY);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.setLineDash([]);
    }
  }

  drawScanlines(scale) {
    const ctx = this.ctx;
    ctx.save();
    ctx.globalAlpha = 0.03;
    ctx.fillStyle = '#000';
    for (let y = 0; y < this.canvas.height; y += 4) {
      ctx.fillRect(0, y, this.canvas.width, 2);
    }
    ctx.restore();
  }

  drawVignette() {
    const ctx = this.ctx;
    const w = this.canvas.width, h = this.canvas.height;
    const grad = ctx.createRadialGradient(w/2, h/2, w*0.4, w/2, h/2, w*0.9);
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
  }

  drawTitleScreen(time, scale) {
    const ctx = this.ctx;
    const w = this.canvas.width, h = this.canvas.height;

    // Background
    this.drawBackground(time, scale);

    // Title
    ctx.save();
    const titleSize = Math.round(80 * scale);
    ctx.font = `900 ${titleSize}px Orbitron, monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#0ff';
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 30 * scale;
    ctx.fillText('量子谜境', w / 2, h * 0.3);
    ctx.shadowBlur = 0;

    // Subtitle
    const subSize = Math.round(20 * scale);
    ctx.font = `${subSize}px Orbitron, monospace`;
    ctx.fillStyle = '#f0f';
    ctx.shadowColor = '#f0f';
    ctx.shadowBlur = 10 * scale;
    ctx.fillText('Q U A N T U M   P U Z Z L E', w / 2, h * 0.3 + 60 * scale);
    ctx.shadowBlur = 0;

    // Start prompt
    const promptAlpha = 0.5 + Math.sin(time * 2) * 0.4;
    ctx.globalAlpha = promptAlpha;
    const promptSize = Math.round(22 * scale);
    ctx.font = `${promptSize}px Orbitron, monospace`;
    ctx.fillStyle = '#fff';
    ctx.fillText('按 SPACE 开始游戏', w / 2, h * 0.6);
    ctx.globalAlpha = 1;

    // Level preview
    const prevSize = Math.round(14 * scale);
    ctx.font = `${prevSize}px Orbitron, monospace`;
    ctx.fillStyle = '#888';
    LEVELS.forEach((lv, i) => {
      const ly = h * 0.7 + i * 28 * scale;
      ctx.fillText(`第${i+1}关: ${lv.name} — ${lv.hint}`, w / 2, ly);
    });

    ctx.restore();
  }


  // ==================== CINEMATIC SYSTEM ====================
  initCinematic() {
    this.cinematicSquares = [];
    for (let i = 0; i < 7; i++) {
      this.cinematicSquares.push({
        x: 280 + i * 220, y: 400 + Math.random() * 280,
        vx: (Math.random() - 0.5) * 180, vy: -100 - Math.random() * 250,
        color: ['#4af','#f4a','#4f8','#fa4','#a4f','#f84','#4ff'][i],
        size: 24 + Math.random() * 26,
        eyeOff: Math.random() * 0.3,
      });
    }
    this.cinematicFireParticles = [];
    for (let i = 0; i < 45; i++) {
      this.cinematicFireParticles.push({
        x: 350 + Math.random() * 1200,
        y: 500 + Math.random() * 350,
        vy: -70 - Math.random() * 220,
        life: 0.3 + Math.random() * 1.8,
        maxLife: 0.3 + Math.random() * 1.8,
        size: 4 + Math.random() * 22,
      });
    }
    this._skipHandler = (e) => {
      if (this.state === 'cinematic' && this.cinematicReady) {
        this.advanceCinematic();
      }
    };
    this.canvas.addEventListener('click', this._skipHandler);
    this.speakNarration('很久很久以前，方块王国的生活十分安宁。', 0);
  }

  speakNarration(text, phaseIdx) {
    this.narrationSpoken[phaseIdx] = false;
    try {
      if (!window.speechSynthesis) { this.narrationSpoken[phaseIdx] = true; return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN';
      u.rate = 0.85;
      u.pitch = 0.6;
      u.volume = 0.95;
      u.onend = () => { this.narrationSpoken[phaseIdx] = true; };
      u.onerror = () => { this.narrationSpoken[phaseIdx] = true; };
      speechSynthesis.speak(u);
    } catch(e) { this.narrationSpoken[phaseIdx] = true; }
  }

  advanceCinematic() {
    if (!this.cinematicReady) return;
    this.cinematicReady = false;
    if (this.cinematicPhase === 0) {
      this.cinematicPhase = 1;
      this.cinematicTimer = 0;
      this.cinematicFade = 1.0;
      this.speakNarration('三角形王国入侵方块王国，而主角方块要去拯救方块王国，打败邪恶的三角形国王。', 1);
    } else if (this.cinematicPhase === 1) {
      this.cinematicPhase = 2;
      this.cinematicTimer = 0;
      this.cinematicFade = 1.0;
      if (this._skipHandler) {
        this.canvas.removeEventListener('click', this._skipHandler);
        this._skipHandler = null;
      }
    }
  }

  updateCinematic(dt) {
    this.cinematicTimer += dt;
    if (this.cinematicFade > 0) { this.cinematicFade = Math.max(0, this.cinematicFade - dt * 2.5); }

    // Enable click-to-continue after minimum display time
    if (!this.cinematicReady && this.cinematicTimer > 1.5) {
      this.cinematicReady = true;
    }

    if (this.cinematicPhase === 0) {
      for (const sq of this.cinematicSquares) {
        sq.vy += 500 * dt;
        sq.x += sq.vx * dt;
        sq.y += sq.vy * dt;
        if (sq.y > 730) { sq.y = 730; sq.vy = -sq.vy * 0.55; }
        if (sq.x < 80 || sq.x > 1840) sq.vx *= -1;
      }
    } else if (this.cinematicPhase === 1) {
      for (const fp of this.cinematicFireParticles) {
        fp.y += fp.vy * dt;
        fp.life -= dt;
        if (fp.life <= 0) {
          fp.y = 600 + Math.random() * 250;
          fp.life = fp.maxLife;
          fp.x = 350 + Math.random() * 1200;
        }
      }
    } else if (this.cinematicPhase === 2) {
      if (this.cinematicFade <= 0.05) {
        this.state = 'tutorialIntro';
        this.cinematicPhase = 0;
        this.cinematicTimer = 0;
        this.cinematicReady = false;
        this.tutorialButtonClicked = false;
        this.tutorialFragments = [];
        this.tutorialFragmentTimer = 0;
      }
    }
  }

  spawnTutorialFragments() {
    const w = this.canvas.width, h = this.canvas.height;
    const bw = w * 0.46, bh = h * 0.18;
    const bx = (w - bw) / 2, by = h * 0.32;
    const cx = bx + bw / 2, cy = by + bh / 2;
    const cols = 24, rows = 12;
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const sx = bx + (col + 0.5) / cols * bw + (Math.random() - 0.5) * bw / cols * 0.6;
        const sy = by + (row + 0.5) / rows * bh + (Math.random() - 0.5) * bh / rows * 0.6;
        const dx = sx - cx, dy = sy - cy;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const speed = 180 + Math.random() * 500;
        this.tutorialFragments.push({
          x: sx, y: sy,
          vx: (dx / dist) * speed + (Math.random() - 0.5) * 250,
          vy: (dy / dist) * speed - 80 - Math.random() * 300,
          rotation: Math.random() * Math.PI * 2,
          rv: (Math.random() - 0.5) * 12,
          size: 3 + Math.random() * 8,
          color: Math.random() < 0.6 ? '#0ff' : (Math.random() < 0.5 ? '#fff' : '#08f'),
          life: 1.0 + Math.random() * 1.0,
          maxLife: 1.0 + Math.random() * 1.0,
        });
      }
    }
    this.tutorialButtonClicked = true;
    this.tutorialFragmentTimer = 0;
    this.audio.sfxOrb();
  }

  drawTutorialIntro(time, scale) {
    const ctx = this.ctx;
    const w = this.canvas.width, h = this.canvas.height;

    // Background
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#020818'); grad.addColorStop(0.5, '#010a20');
    grad.addColorStop(1, '#010510');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);

    // Grid
    ctx.strokeStyle = '#0ff';
    ctx.globalAlpha = 0.04;
    ctx.lineWidth = 1;
    const gs = 55 * scale;
    for (let x = (time * 20 * scale) % gs; x < w; x += gs) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    for (let y = 0; y < h; y += gs) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Floating particles
    for (let i = 0; i < 35; i++) {
      const px = ((i * 173 + time * 25 * (i % 3 + 1)) % w + w) % w;
      const py = ((i * 241 + Math.sin(time + i) * 50) % h + h) % h;
      ctx.globalAlpha = 0.15 + Math.sin(time * 2 + i) * 0.1;
      ctx.fillStyle = i % 3 === 0 ? '#0ff' : (i % 3 === 1 ? '#f0f' : '#fff');
      ctx.fillRect(px, py, (1.5 + (i % 3)) * scale, (1.5 + (i % 3)) * scale);
    }
    ctx.globalAlpha = 1;

    if (!this.tutorialButtonClicked) {
      // Button dimensions
      const bw = w * 0.46, bh = h * 0.18;
      const bx = (w - bw) / 2, by = h * 0.32;
      const pulse = 0.55 + Math.sin(time * 2.5) * 0.3;

      // Outer glow layers
      for (let l = 3; l >= 0; l--) {
        const expand = l * 8 * scale * pulse;
        ctx.strokeStyle = `rgba(0,255,255,${0.15 - l * 0.03})`;
        ctx.lineWidth = (1 + l * 0.8) * scale;
        ctx.shadowColor = '#0ff';
        ctx.shadowBlur = (10 + l * 8) * scale * pulse;
        ctx.strokeRect(bx - expand, by - expand, bw + expand * 2, bh + expand * 2);
      }
      ctx.shadowBlur = 0;

      // Button body
      const bodyGrad = ctx.createLinearGradient(bx, by, bx, by + bh);
      bodyGrad.addColorStop(0, 'rgba(0,40,60,0.85)');
      bodyGrad.addColorStop(0.5, 'rgba(0,20,40,0.9)');
      bodyGrad.addColorStop(1, 'rgba(0,10,25,0.85)');
      ctx.fillStyle = bodyGrad;
      ctx.fillRect(bx, by, bw, bh);

      // Top edge bright line
      ctx.strokeStyle = '#0ff';
      ctx.lineWidth = 2.5 * scale;
      ctx.shadowColor = '#0ff';
      ctx.shadowBlur = 15 * scale * pulse;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + bw, by); ctx.stroke();
      ctx.shadowBlur = 0;

      // Corner accents
      const cl = 25 * scale;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2 * scale;
      ctx.globalAlpha = 0.7 * pulse;
      // Top-left
      ctx.beginPath(); ctx.moveTo(bx, by + cl); ctx.lineTo(bx, by); ctx.lineTo(bx + cl, by); ctx.stroke();
      // Top-right
      ctx.beginPath(); ctx.moveTo(bx + bw - cl, by); ctx.lineTo(bx + bw, by); ctx.lineTo(bx + bw, by + cl); ctx.stroke();
      // Bottom-left
      ctx.beginPath(); ctx.moveTo(bx, by + bh - cl); ctx.lineTo(bx, by + bh); ctx.lineTo(bx + cl, by + bh); ctx.stroke();
      // Bottom-right
      ctx.beginPath(); ctx.moveTo(bx + bw - cl, by + bh); ctx.lineTo(bx + bw, by + bh); ctx.lineTo(bx + bw, by + bh - cl); ctx.stroke();
      ctx.globalAlpha = 1;

      // Title text
      ctx.font = `900 ${Math.round(50 * scale)}px Orbitron, monospace`;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#0ff';
      ctx.shadowColor = '#0ff';
      ctx.shadowBlur = 22 * scale * pulse;
      ctx.fillText('新 手 教 程', w / 2, by + bh * 0.58);
      ctx.shadowBlur = 0;

      // Subtitle
      ctx.font = `${Math.round(13 * scale)}px Orbitron, monospace`;
      ctx.fillStyle = '#8cf';
      ctx.fillText('TUTORIAL  ·  5个理科谜题', w / 2, by + bh * 0.82);

      // Click hint
      ctx.globalAlpha = 0.35 + Math.sin(time * 2) * 0.2;
      ctx.font = `${Math.round(15 * scale)}px Orbitron, monospace`;
      ctx.fillStyle = '#fff';
      ctx.fillText('点击按钮 或 按 SPACE 开始', w / 2, h * 0.62);
      ctx.globalAlpha = 1;
      ctx.textAlign = 'start';
    }

    // Draw square fragments
    for (const f of this.tutorialFragments) {
      const alpha = Math.max(0, f.life / f.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rotation);
      ctx.fillStyle = f.color;
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 6 * scale * alpha;
      const fs = f.size * scale;
      ctx.fillRect(-fs / 2, -fs / 2, fs, fs);
      ctx.restore();
    }
  }

  drawCinematic(time, scale) {
    const ctx = this.ctx;
    const w = this.canvas.width, h = this.canvas.height;

    if (this.cinematicPhase === 0) {
      // Scene 1: Peaceful Kingdom
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, '#1a3525'); grad.addColorStop(0.4, '#3a6540');
      grad.addColorStop(0.7, '#2a4520'); grad.addColorStop(1, '#0a1508');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);

      // Sun
      ctx.fillStyle = '#ffe8a0'; ctx.shadowColor = '#ffd060';
      ctx.shadowBlur = 80 * scale;
      ctx.beginPath(); ctx.arc(w * 0.78, h * 0.18, 55 * scale, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;

      // Ground
      const gy = h * 0.72;
      ctx.fillStyle = '#2a5a20'; ctx.fillRect(0, gy, w, h - gy);
      ctx.fillStyle = '#4a9a30'; ctx.fillRect(0, gy, w, 5 * scale);

      // Happy squares bouncing
      for (const sq of this.cinematicSquares) {
        const sx = sq.x * scale, sy = sq.y * scale, ss = sq.size * scale;
        ctx.fillStyle = sq.color; ctx.shadowColor = sq.color; ctx.shadowBlur = 10 * scale;
        ctx.fillRect(sx - ss/2, sy - ss/2, ss, ss);
        ctx.shadowBlur = 0;
        // Eyes (happy ^ ^)
        ctx.fillStyle = '#fff';
        const ex = sx - ss*0.12, ey = sy - ss*0.08, es = ss*0.1;
        ctx.fillRect(ex - ss*0.12, ey, es, es);
        ctx.fillRect(ex + ss*0.2, ey, es, es);
      }

      // Narration
      ctx.fillStyle = '#ffe8c0'; ctx.textAlign = 'center';
      ctx.font = `900 ${Math.round(26*scale)}px Orbitron, monospace`;
      ctx.fillText('第 一 幕', w/2, h * 0.1);
      ctx.fillStyle = '#fff';
      ctx.font = `${Math.round(19*scale)}px Orbitron, monospace`;
      ctx.fillText('「很久很久以前，方块王国的生活十分安宁」', w/2, h * 0.84);
      ctx.globalAlpha = 0.35;
      const hintText = this.cinematicReady ? '▶ 点击继续' : '请聆听旁白...';
      ctx.fillText(hintText, w/2, h * 0.91);
      ctx.globalAlpha = 1; ctx.textAlign = 'start';

    } else if (this.cinematicPhase >= 1) {
      // Scene 2: Invasion
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, '#050000'); grad.addColorStop(0.5, '#1a0505');
      grad.addColorStop(1, '#0a0000');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);

      // Fire glow
      const glow = ctx.createRadialGradient(w/2, h*0.55, 0, w/2, h*0.5, w*0.75);
      glow.addColorStop(0, 'rgba(255,60,0,0.35)'); glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow; ctx.fillRect(0, 0, w, h);

      // Fire particles
      for (const fp of this.cinematicFireParticles) {
        const a = Math.max(0, fp.life / fp.maxLife);
        ctx.fillStyle = `rgba(255,${Math.floor(120*a)},0,${a})`;
        const fx = fp.x * scale, fy = fp.y * scale, fs = fp.size * scale;
        ctx.fillRect(fx - fs*0.3, fy, fs*0.6, fs * 1.8);
        ctx.fillStyle = `rgba(255,${Math.floor(200*a)},40,${a*0.6})`;
        ctx.fillRect(fx - fs*0.15, fy - fs*0.4, fs*0.3, fs);
      }

      // Ground
      const gy = h * 0.76;
      ctx.fillStyle = '#100303'; ctx.fillRect(0, gy, w, h - gy);

      // Fallen squares
      const fallen = [[280,25],[580,22],[1320,28],[1580,20]];
      for (const [fx, fsz] of fallen) {
        const fs = fsz * scale, sx = fx * scale, sy = gy - fs;
        ctx.fillStyle = '#111'; ctx.fillRect(sx, sy, fs, fs);
        // Arrow through them
        ctx.strokeStyle = '#444'; ctx.lineWidth = 1.5 * scale;
        ctx.beginPath(); ctx.moveTo(sx + fs*0.5, sy + fs*0.6); ctx.lineTo(sx + fs*0.85, sy + fs*0.15); ctx.stroke();
        // Arrowhead
        ctx.fillStyle = '#555';
        ctx.beginPath(); ctx.moveTo(sx + fs*0.85, sy + fs*0.15);
        ctx.lineTo(sx + fs*0.68, sy + fs*0.28); ctx.lineTo(sx + fs*0.78, sy + fs*0.42); ctx.fill();
      }

      // Hero square
      const hx = w * 0.44, hy = gy - 65*scale, hs = 58 * scale;
      ctx.fillStyle = '#0cf'; ctx.shadowColor = '#0ff'; ctx.shadowBlur = 30 * scale;
      ctx.fillRect(hx, hy - hs, hs, hs);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3 * scale;
      ctx.strokeRect(hx, hy - hs, hs, hs);
      ctx.shadowBlur = 0;
      // Eyes (determined)
      ctx.fillStyle = '#fff';
      ctx.fillRect(hx + hs*0.15, hy - hs*0.65, hs*0.13, hs*0.2);
      ctx.fillRect(hx + hs*0.55, hy - hs*0.65, hs*0.13, hs*0.2);
      ctx.fillStyle = '#000';
      ctx.fillRect(hx + hs*0.18, hy - hs*0.62, hs*0.08, hs*0.13);
      ctx.fillRect(hx + hs*0.58, hy - hs*0.62, hs*0.08, hs*0.13);

      // Narration
      ctx.fillStyle = '#ff6060'; ctx.textAlign = 'center';
      ctx.font = `900 ${Math.round(26*scale)}px Orbitron, monospace`;
      ctx.fillText('第 二 幕', w/2, h * 0.1);
      ctx.fillStyle = '#fff';
      ctx.font = `${Math.round(17*scale)}px Orbitron, monospace`;
      ctx.fillText('「三角形王国入侵，主角要去拯救方块王国，', w/2, h * 0.89);
      ctx.fillText('打败邪恶的三角形国王！」', w/2, h * 0.94);
      ctx.globalAlpha = 0.35;
      const hintText2 = this.cinematicReady ? '▶ 点击继续' : '请聆听旁白...';
      ctx.fillText(hintText2, w/2, h * 0.98);
      ctx.globalAlpha = 1; ctx.textAlign = 'start';
    }

    // Fade overlay
    if (this.cinematicFade > 0.01) {
      ctx.fillStyle = `rgba(0,0,0,${this.cinematicFade})`;
      ctx.fillRect(0, 0, w, h);
    }
  }

  // ==================== STORY SYSTEM ====================
  initStory() {
    this.hideHUD();
    this.storyPhase = 0; this.storyTimer = 0; this.storyReady = false;
    this.storyPlayer = { x: 860, y: -300, vx: 0, vy: 0, onGround: false, facing: 1, normalH: 44, crouchH: 22, h: 44, crouching: false };;
    this.storyDustParticles = [];
    this.storyDoorSelected = -1; this.storyDoorAnimTimer = 0; this.storyDoorAnimating = false;
    this.storyHouseNarrationDone = false;
    this.storyInteriorPlayer = { x: 160, y: 826, vx: 0, vy: 0, onGround: false, facing: 1, normalH: 44, crouchH: 22, h: 44, crouching: false };
  }

  updateStory(dt) {
    this.storyTimer += dt;
    const sp = this.storyPlayer;
    const sip = this.storyInteriorPlayer;
    const G = 1400, MOVE = 400, JUMP = -620;

    switch (this.storyPhase) {
      case 0: // Black screen, wait then show prompt
        if (this.storyTimer > 3.0 && !this.storyReady) this.storyReady = true;
        break;

      case 1: // Falling from sky
        sp.vy += G * dt;
        sp.y += sp.vy * dt;
        if (sp.y >= 806 && sp.vy > 0) {
          sp.y = 806; sp.vy = 0; sp.onGround = true;
          this.audio.sfxLand();
          for (let i = 0; i < 35; i++) {
            this.storyDustParticles.push({
              x: sp.x + 22, y: 850, vx: (Math.random() - 0.5) * 350,
              vy: -120 - Math.random() * 280, life: 0.5 + Math.random() * 1.0,
              maxLife: 0.5 + Math.random() * 1.0, size: 3 + Math.random() * 12,
            });
          }
          this.storyPhase = 2; this.storyTimer = 0;
        }
        break;

      case 2: // Question mark over player
        if (this.storyTimer > 2.0) { this.storyPhase = 3; this.storyTimer = 0; }
        break;

      case 3: // Exploration - player can move
        sp.vx = 0;
        if (this.keys['ArrowLeft'] || this.keys['KeyA']) { sp.vx = -MOVE; sp.facing = -1; }
        if (this.keys['ArrowRight'] || this.keys['KeyD']) { sp.vx = MOVE; sp.facing = 1; }
        // Crouch
        const crouchDown = this.keys['ArrowDown'] || this.keys['KeyS'];
        sp.crouching = crouchDown && sp.onGround;
        sp.h = sp.crouching ? sp.crouchH : sp.normalH;
        if (this.keys['Space'] || this.keys['ArrowUp'] || this.keys['KeyW']) {
          if (sp.onGround) {
            sp.vy = JUMP; sp.onGround = false; sp.jumpsLeft = 2;
            this.audio.sfxJump();
          } else if (sp.jumpsLeft > 1 && !this._storyJumpHeld) {
            sp.vy = JUMP * 0.85; sp.jumpsLeft = 1;
            this.audio.sfxJump();
          }
        }
        this._storyJumpHeld = this.keys['Space'] || this.keys['ArrowUp'] || this.keys['KeyW'];
        sp.vy += G * dt;
        sp.x += sp.vx * dt; sp.y += sp.vy * dt;
        // Ground
        if (sp.y + sp.h >= 850) { sp.y = 850 - sp.h; sp.vy = 0; sp.onGround = true; sp.jumpsLeft = 2; }
        else if (sp.y >= 806 && sp.vy >= 0) { sp.y = 806; sp.vy = 0; sp.onGround = true; }
        // Bounds
        if (sp.x < 0) sp.x = 0;
        if (sp.x > 2000) sp.x = 2000;
        // Check house collision
        if (sp.x + 44 > 1520 && sp.x < 1900 && sp.y + sp.h > 580 && sp.y < 850) {
          this.storyPhase = 4; this.storyTimer = 0;
          this.audio.sfxSwitch();
        }
        break;

      case 4: // Black screen before interior
        if (this.storyTimer > 0.6) {
          this.storyPhase = 5; this.storyTimer = 0;
          this.storyHouseNarrationDone = false;
          this.narrationSpoken = [false, false];
          this.speakNarration('只要通过三道石门，这座小屋就会赐予你直面三角形国王的机会。', 0);
        }
        break;

      case 5: // Interior + narration playing (doors locked)
        // Track narration completion
        if (this.narrationSpoken[0] && !this.storyHouseNarrationDone) {
          this.storyHouseNarrationDone = true;
        }
        if (this.storyHouseNarrationDone && this.storyTimer > 1.0) {
          this.storyPhase = 6; this.storyTimer = 0;
        }
        break;

      case 6: // Door interaction enabled
        if (!this.storyDoorAnimating) {
          sip.vx = 0;
          if (this.keys['ArrowLeft'] || this.keys['KeyA']) { sip.vx = -MOVE; sip.facing = -1; }
          if (this.keys['ArrowRight'] || this.keys['KeyD']) { sip.vx = MOVE; sip.facing = 1; }
          // Crouch
          const crouchDn = this.keys['ArrowDown'] || this.keys['KeyS'];
          sip.crouching = crouchDn && sip.onGround;
          sip.h = sip.crouching ? sip.crouchH : sip.normalH;
          if (this.keys['Space'] || this.keys['ArrowUp'] || this.keys['KeyW']) {
            if (sip.onGround) {
              sip.vy = JUMP; sip.onGround = false; sip.jumpsLeft = 2;
              this.audio.sfxJump();
            } else if (sip.jumpsLeft > 1 && !this._interiorJumpHeld) {
              sip.vy = JUMP * 0.85; sip.jumpsLeft = 1;
              this.audio.sfxJump();
            }
          }
          this._interiorJumpHeld = this.keys['Space'] || this.keys['ArrowUp'] || this.keys['KeyW'];
          sip.vy += G * dt;
          sip.x += sip.vx * dt; sip.y += sip.vy * dt;
          if (sip.y + sip.h >= 880) { sip.y = 880 - sip.h; sip.vy = 0; sip.onGround = true; sip.jumpsLeft = 2; }
          else if (sip.y >= 826 && sip.vy >= 0) { sip.y = 826; sip.vy = 0; sip.onGround = true; }
          if (sip.x < 40) sip.x = 40;
          if (sip.x > 1880) sip.x = 1880;
          // Check door interaction (Shift key, skip completed doors)
          if (this.keys['ShiftLeft'] || this.keys['ShiftRight']) {
            // Check portal first
            var allDoorsDone2 = this.mathDoorsDone[0] && this.physicsDoorsDone[1] && this.chemDoorsDone[2];
            if (allDoorsDone2 && sip.x+44>920 && sip.x<1000 && sip.y+44>560 && sip.y<640) {
              this.keys['ShiftLeft'] = false; this.keys['ShiftRight'] = false;
              this.state = 'finalBoss'; this.storyPhase = 0;
              this.initFinalBoss();
              this.showMessage('传送至三角形国王的王宫...', 2000);
              this.audio.sfxLevelComplete();
              break;
            }
            for (let i = 0; i < this.storyDoors.length; i++) {
              if (this.mathDoorsDone[i] || this.physicsDoorsDone[i] || this.chemDoorsDone[i]) continue;
              const d = this.storyDoors[i];
              if (sip.x + 44 > d.x && sip.x < d.x + d.w && sip.y + 44 > d.y) {
                this.storyDoorSelected = i;
                this.storyDoorAnimating = true;
                this.storyDoorAnimTimer = 0;
                this.audio.sfxLevelComplete();
                // Trigger math trial after animation
                if (i === 0) {
                  setTimeout(() => {
                    this.mathActive = true; this.mathLevel = 0; this.showHUD(); this._hudHidden = false;
                    this.state = 'mathEntry'; this.startMathEntry(); this.loadMathLevel();
                  }, 1600);
                } else if (i === 1) {
                  setTimeout(() => {
                    this.physicsActive = true; this.physicsLevel = 0; this.showHUD(); this._hudHidden = false;
                    this.state = 'physicsEntry'; this.startMathEntry(); this.loadPhysicsLevel();
                  }, 1600);
                } else if (i === 2) {
                  setTimeout(() => {
                    this.chemActive = true; this.chemLevel = 0; this.showHUD(); this._hudHidden = false;
                    this.state = 'chemEntry'; this.startMathEntry(); this.loadChemLevel();
                  }, 1600);
                }
                this.keys['ShiftLeft'] = false;
                this.keys['ShiftRight'] = false;
                break;
              }
            }
          }
        } else {
          this.storyDoorAnimTimer += dt;
          if (this.storyDoorAnimTimer > 1.5) {
            const d = this.storyDoors[this.storyDoorSelected];
            this.showMessage(d.name + '试炼 - 即将到来...', 3000);
            this.storyDoorAnimating = false;
            this.storyDoorSelected = -1;
          }
        }
        break;
    }

    // Update dust particles (all phases)
    for (const dp of this.storyDustParticles) {
      dp.x += dp.vx * dt; dp.y += dp.vy * dt;
      dp.vy += 180 * dt; dp.life -= dt;
    }
    this.storyDustParticles = this.storyDustParticles.filter(p => p.life > 0);
  }

  // ---- Story Rendering ----
  drawStoryBlackScreen(scale) {
    const ctx = this.ctx, w = this.canvas.width, h = this.canvas.height;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
    if (this.storyReady) {
      ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.4 + Math.sin(this.time * 2) * 0.2;
      ctx.font = `${Math.round(18*scale)}px Orbitron, monospace`;
      ctx.textAlign = 'center';
      ctx.fillText('点击继续', w/2, h * 0.7);
      ctx.textAlign = 'start'; ctx.globalAlpha = 1;
    }
  }

  drawStoryFalling(scale) {
    const ctx = this.ctx, w = this.canvas.width, h = this.canvas.height;
    // Sky background
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#1a3a6a'); grad.addColorStop(0.6, '#4a8aca');
    grad.addColorStop(1, '#2a6a2a');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
    // Clouds
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for (let i = 0; i < 5; i++) {
      const cx = ((i * 350 + 100) * scale) % w, cy = (120 + i * 80) * scale;
      ctx.beginPath(); ctx.arc(cx, cy, 35*scale, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 25*scale, cy - 10*scale, 28*scale, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx - 20*scale, cy + 5*scale, 25*scale, 0, Math.PI*2); ctx.fill();
    }
    // Ground (approaching)
    const gy = 850 * scale;
    ctx.fillStyle = '#3a7a2a'; ctx.fillRect(0, gy, w, h - gy);
    ctx.fillStyle = '#2a5a1a'; ctx.fillRect(0, gy, w, 5*scale);
    // Player falling
    const sp = this.storyPlayer;
    const px = sp.x * scale, py = sp.y * scale, ps = 44 * scale;
    ctx.fillStyle = '#0cf'; ctx.shadowColor = '#0ff'; ctx.shadowBlur = 20 * scale;
    ctx.fillRect(px, py, ps, ps);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3*scale; ctx.strokeRect(px, py, ps, ps);
    ctx.shadowBlur = 0;
    // Wind lines
    ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1;
    for (let i = 0; i < 8; i++) {
      const lx = ((i * 220 + this.time * 400) % (w + 200)) - 100;
      ctx.beginPath(); ctx.moveTo(lx, py + ps*0.5); ctx.lineTo(lx - 40*scale, py + ps*0.5 + 10*scale); ctx.stroke();
    }
    // Dust
    this.drawStoryDust(scale);
  }

  drawStoryDust(scale) {
    const ctx = this.ctx;
    for (const dp of this.storyDustParticles) {
      ctx.globalAlpha = Math.max(0, dp.life / dp.maxLife) * 0.7;
      ctx.fillStyle = '#baa';
      ctx.fillRect(dp.x * scale, dp.y * scale, dp.size * scale, dp.size * scale * 0.6);
    }
    ctx.globalAlpha = 1;
  }

  drawStoryExploration(scale) {
    const ctx = this.ctx, w = this.canvas.width, h = this.canvas.height;
    // Sky (same as falling scene)
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#3a6aaa'); grad.addColorStop(0.7, '#6abafa');
    grad.addColorStop(1, '#4a8a3a');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
    // Clouds
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    for (let i = 0; i < 4; i++) {
      const cx = ((i * 400 + 80) * scale) % w, cy = (100 + i * 90) * scale;
      ctx.beginPath(); ctx.arc(cx, cy, 28*scale, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 20*scale, cy - 8*scale, 22*scale, 0, Math.PI*2); ctx.fill();
    }
    // Ground
    const gy = 850 * scale;
    ctx.fillStyle = '#3a7a2a'; ctx.fillRect(0, gy, w, h - gy);
    ctx.fillStyle = '#5aaa3a'; ctx.fillRect(0, gy, w, 5*scale);

    // House on the right
    const hx = 1480 * scale, hy = 520 * scale, hw = 440 * scale, hh = 330 * scale;
    ctx.fillStyle = '#6b4c3a'; ctx.fillRect(hx, hy, hw, hh);
    ctx.strokeStyle = '#4a3020'; ctx.lineWidth = 2*scale; ctx.strokeRect(hx, hy, hw, hh);
    ctx.beginPath();
    ctx.fillStyle = '#3a2010';
    ctx.moveTo(hx - 30*scale, hy); ctx.lineTo(hx + hw/2, hy - 100*scale);
    ctx.lineTo(hx + hw + 30*scale, hy); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#2a1000'; ctx.stroke();
    const dx = hx + hw/2 - 40*scale, dy = hy + hh - 100*scale;
    ctx.fillStyle = '#1a0a00'; ctx.fillRect(dx, dy, 80*scale, 100*scale);
    ctx.strokeStyle = '#4a3020'; ctx.lineWidth = 2*scale; ctx.strokeRect(dx, dy, 80*scale, 100*scale);
    ctx.fillStyle = '#8cf'; ctx.fillRect(hx + 50*scale, hy + 50*scale, 60*scale, 60*scale);
    ctx.strokeStyle = '#4a3020'; ctx.strokeRect(hx + 50*scale, hy + 50*scale, 60*scale, 60*scale);

    // === PLAYER (drawn LAST, with save/restore) ===
    ctx.save();
    const sp = this.storyPlayer;
    const psW = 44 * scale, psH = (sp.h || 44) * scale;
    const px = sp.x * scale, py = sp.y * scale;
    // Outer glow
    ctx.shadowColor = '#0ff'; ctx.shadowBlur = 18 * scale;
    ctx.fillStyle = 'rgba(0,255,255,0.25)';
    ctx.fillRect(px - 4*scale, py - 4*scale, psW + 8*scale, psH + 8*scale);
    // Body
    ctx.shadowBlur = 10 * scale;
    ctx.fillStyle = '#0cf';
    ctx.fillRect(px, py, psW, psH);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5*scale;
    ctx.strokeRect(px, py, psW, psH);
    // Eyes + pupils
    ctx.fillStyle = '#fff';
